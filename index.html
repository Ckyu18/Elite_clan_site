<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let members = [];

let currentMode = null;

let currentMemberId = null;

let currentNickname = "";

let currentView = "all";


/* =========================================================
   LOGIN UI
========================================================= */

function showMemberLogin(){

  document.getElementById(
    "login-screen"
  ).style.display =
    "flex";

  document.getElementById(
    "admin-login-screen"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "app"
  ).style.display =
    "none";

}


function showAdminLogin(){

  document.getElementById(
    "login-screen"
  ).style.display =
    "none";

  document.getElementById(
    "admin-login-screen"
  ).classList.remove(
    "hidden"
  );

  setTimeout(
    () => {

      document.getElementById(
        "admin-password"
      ).focus();

    },
    100
  );

}


function backToMemberLogin(){

  showMemberLogin();

}


/* =========================================================
   MEMBER LOGIN
========================================================= */

async function memberLogin(){

  const nickname =
    document.getElementById(
      "login-nickname"
    ).value.trim();

  const password =
    document.getElementById(
      "login-password"
    ).value;

  const status =
    document.getElementById(
      "login-status"
    );


  if(!nickname){

    status.textContent =
      "닉네임을 입력해주세요.";

    return;

  }


  if(!password){

    status.textContent =
      "공동비밀번호를 입력해주세요.";

    return;

  }


  status.textContent =
    "접속 중...";


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_login",
      {
        p_nickname:
          nickname,

        p_password:
          password,

        p_mode:
          "member"
      }
    );


  if(error){

    console.error(error);

    status.textContent =
      "❌ 접속 실패: " +
      error.message;

    return;

  }


  if(
    !data ||
    !data.success
  ){

    status.textContent =
      data?.message ||
      "접속할 수 없습니다.";

    return;

  }


  currentMode =
    "member";

  currentMemberId =
    Number(
      data.member_id
    );

  currentNickname =
    data.nickname ||
    nickname;


  localStorage.setItem(
    "fm_mode",
    "member"
  );

  localStorage.setItem(
    "fm_member_id",
    String(
      currentMemberId
    )
  );

  localStorage.setItem(
    "fm_nickname",
    currentNickname
  );


  await startApp();

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function adminLogin(){

  const password =
    document.getElementById(
      "admin-password"
    ).value;

  const status =
    document.getElementById(
      "admin-login-status"
    );


  if(!password){

    status.textContent =
      "관리자 비밀번호를 입력해주세요.";

    return;

  }


  status.textContent =
    "관리자 확인 중...";


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_login",
      {
        p_nickname:
          "",

        p_password:
          password,

        p_mode:
          "admin"
      }
    );


  if(error){

    console.error(error);

    status.textContent =
      "❌ 관리자 접속 실패: " +
      error.message;

    return;

  }


  if(
    !data ||
    !data.success
  ){

    status.textContent =
      data?.message ||
      "관리자 접속에 실패했습니다.";

    return;

  }


  currentMode =
    "admin";

  currentMemberId =
    null;

  currentNickname =
    "관리자";


  localStorage.setItem(
    "fm_mode",
    "admin"
  );

    error
  } =

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeMember(row){

  return {

    id:
      row.id,

    created_at:
      row.created_at,

    updated_at:
      row.updated_at,

    name:
      row.nickname ||
      "",

    chomul:
      row.초물 ||
      "",

    skill:
      row.스킬 ||
      "",

    skill_lv:
      Number(
        row.스킬_lv ||
        0
      ),

    eggshell:
      row.알껍질 ||
      "",

    eggshell_lv:
      Number(
        row.알껍질_lv ||
        0
      ),

    eggmerge:
      Number(
        row.알합치기 ||
        0
      ),

    mount:
      row.탈것 ||
      "",

    mount_lv:
      Number(
        row.탈것_lv ||
        0
      ),

    mountmerge:
      Number(
        row.탈것합치기 ||
        0
      ),

    스:
      Boolean(
        row.스
      ),

    펫:
      Boolean(
        row.펫
      ),

    탈:
      Boolean(
        row.탈
      )

  };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const tbody =
    document.getElementById(
      "members"
    );


  if(!tbody)
    return;


  tbody.innerHTML =
    "";


  let list =
    [...members];


  const search =
    (
      document.getElementById(
        "search"
      )?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const sort =
    document.getElementById(
      "sort"
    )?.value ||
    "default";


  if(search){

    list =
      list.filter(
        member =>
          String(
            member.name
          )
          .toLowerCase()
          .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(
          b[sort]
        ) -
        toNumber(
          a[sort]
        )
    );

  }


  if(list.length === 0){

    tbody.innerHTML =
      `
      <tr>
        <td
          colspan="10"
          class="empty"
        >
          표시할 클랜원이 없습니다.
        </td>
      </tr>
      `;

    updateTotals();

    return;

  }


  list.forEach(
    (member,index) => {

      const originalIndex =
        members.findIndex(
          x =>
            x.id === member.id
        );


      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML =
        buildRow(
          member,
          originalIndex,
          index
        );


      tbody.appendChild(
        tr
      );


      applyColumnView(
        tr
      );


      checkColor(
        document.getElementById(
          "skill-" +
          originalIndex
        ),
        "skill"
      );


      checkColor(
        document.getElementById(
          "eggshell-" +
          originalIndex
        ),
        "eggshell"
      );


      checkColor(
        document.getElementById(
          "mount-" +
          originalIndex
        ),
        "mount"
      );

    }
  );


  updateTotals();

}

/* =========================================================
   COLUMN VIEW
========================================================= */

function setView(view){

  currentView =
    view;


  document
    .querySelectorAll(
      ".view-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.view === view
        );

      }
    );


  applyView();

}


function applyView(){

  document
    .querySelectorAll(
      "[data-column]"
    )
    .forEach(
      element => {

        element.style.display =
          "";

      }
    );


  if(
    currentView === "all"
  ){

    return;

  }


  if(
    currentView === "ascension"
  ){

    hideAllColumns();

    showColumn(
      "ascension"
    );

    showColumn(
      "nickname"
    );

    return;

  }


  hideAllColumns();

  showColumn(
    "nickname"
  );

  showColumn(
    currentView
  );

}


function hideAllColumns(){

  document
    .querySelectorAll(
      "[data-column]"
    )
    .forEach(
      element => {

        element.style.display =
          "none";

      }
    );

}


function showColumn(
  column
){

  document
    .querySelectorAll(
      `[data-column="${column}"]`
    )
    .forEach(
      element => {

        element.style.display =
          "";

      }
    );

}


function applyColumnView(
  tr
){

  if(
    currentView === "all"
  )
    return;


  if(
    currentView === "ascension"
  ){

    tr
      .querySelectorAll(
        "[data-column]"
      )
      .forEach(
        element => {

          element.style.display =
            "none";

        }
      );


    const ascension =
      tr.querySelector(
        '[data-column="ascension"]'
      );

    const nickname =
      tr.querySelector(
        '[data-column="nickname"]'
      );


    if(ascension)
      ascension.style.display =
        "";

    if(nickname)
      nickname.style.display =
        "";

    return;

  }


  tr
    .querySelectorAll(
      "[data-column]"
    )
    .forEach(
      element => {

        element.style.display =
          "none";

      }
    );


  const nickname =
    tr.querySelector(
      '[data-column="nickname"]'
    );

  const target =
    tr.querySelector(
      `[data-column="${currentView}"]`
    );


  if(nickname)
    nickname.style.display =
      "";

  if(target)
    target.style.display =
      "";

}

/* =========================================================
   SAVE
========================================================= */

async function saveMember(index){

  const member =
    members[index];


  if(!member)
    return;


  const canEdit =
    currentMode === "admin" ||
    member.id === currentMemberId;


  if(!canEdit){

    alert(
      "수정 권한이 없습니다."
    );

    return;

  }


  const value =
    field => {

      const element =
        document.getElementById(
          field +
          "-" +
          index
        );

      return element
        ? element.value.trim()
        : "";

    };


  const checked =
    type => {

      const element =
        document.getElementById(
          type +
          "-" +
          index
        );

      return element
        ? element.checked
        : false;

    };


  setStatus(
    "💾 저장 중..."
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_update_member",
      {

        p_mode:
          currentMode,

        p_member_id:
          member.id,

        p_nickname:
          value("name"),

        p_chomul:
          value("chomul"),

        p_skill:
          value("skill"),

        p_skill_lv:
          Number(
            value("skill_lv")
          ) || 0,

        p_eggshell:
          value("eggshell"),

        p_eggshell_lv:
          Number(
            value("eggshell_lv")
          ) || 0,

        p_eggmerge:
          Number(
            value("eggmerge")
          ) || 0,

        p_mount:
          value("mount"),

        p_mount_lv:
          Number(
            value("mount_lv")
          ) || 0,

        p_mountmerge:
          Number(
            value("mountmerge")
          ) || 0,

        p_s:
          checked("check_s"),

        p_pet:
          checked("check_pet"),

        p_tal:
          checked("check_tal")

      }
    );


  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n" +
      error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;

  }


  if(!data){

    alert(
      "저장 결과를 받지 못했습니다."
    );

    return;

  }


  members[index] =
    normalizeMember(
      data
    );


  if(
    member.id === currentMemberId
  ){

    currentNickname =
      members[index].name;

    localStorage.setItem(
      "fm_nickname",
      currentNickname
    );

  }


  render();


  setStatus(
    "✅ 저장 완료",
    "success"
  );

}


/* =========================================================
   CHECKBOX
========================================================= */

async function toggleCheck(
  index,
  type
){

  const member =
    members[index];


  if(!member)
    return;


  const canEdit =
    currentMode === "admin" ||
    member.id === currentMemberId;


  if(!canEdit)
    return;


  const ids = {

    "스":
      "check_s-" +
      index,

    "펫":
      "check_pet-" +
      index,

    "탈":
      "check_tal-" +
      index

  };


  const checkbox =
    document.getElementById(
      ids[type]
    );


  if(!checkbox)
    return;


  const oldValue =
    member[type];


  const newValue =
    checkbox.checked;


  member[type] =
    newValue;


  const {
    error
  } =
  await supabaseClient
    .rpc(
      "fm_update_member",
      {

        p_mode:
          currentMode,

        p_member_id:
          member.id,

        p_nickname:
          member.name,

        p_chomul:
          member.chomul,

        p_skill:
          member.skill,

        p_skill_lv:
          member.skill_lv,

        p_eggshell:
          member.eggshell,

        p_eggshell_lv:
          member.eggshell_lv,

        p_eggmerge:
          member.eggmerge,

        p_mount:
          member.mount,

        p_mount_lv:
          member.mount_lv,

        p_mountmerge:
          member.mountmerge,

        p_s:
          type === "스"
            ? newValue
            : member.스,

        p_pet:
          type === "펫"
            ? newValue
            : member.펫,

        p_tal:
          type === "탈"
            ? newValue
            : member.탈

      }
    );


  if(error){

    member[type] =
      oldValue;

    checkbox.checked =
      oldValue;

    alert(
      "체크 저장 실패\n\n" +
      error.message
    );

    return;

  }


  setStatus(
    "✅ " +
    type +
    " 저장 완료",
    "success"
  );

}


/* =========================================================
   COLOR
========================================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}


/* =========================================================
   NUMBER
========================================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(
      text
    );


  if(
    isNaN(number)
  )
    return 0;


  if(
    text.endsWith("m")
  ){

    number *=
      1000000;

  }
  else if(
    text.endsWith("k")
  ){

    number *=
      1000;

  }


  return number;

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(
  number
){

  if(
    number === 0
  )
    return "0";


  if(
    number >= 1000000
  ){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    ) + "m";

  }


  if(
    number >= 1000
  ){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    ) + "k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================================
   UPDATED
========================================================= */

function formatUpdated(
  value
){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff / 60000
    );


  if(minutes < 1){

    return "방금 수정";

  }


  if(minutes < 60){

    return minutes +
      "분 전";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours +
      "시간 전";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days +
      "일 전";

  }


  return (
    date.getMonth() + 1
  ) +
  "월 " +
  date.getDate() +
  "일";

}

function updateTotals(){

    "eggshell",

    "mountmerge"

  const totals = {

    skill:0,
    eggshell:0,
    eggmerge:0,

      );

  document.getElementById(

    formatNumber(
      totals.chomul

    formatNumber(
      totals.skill
    );


  document.getElementById(
    "total-eggshell"

    formatNumber(
      totals.eggshell
    );


  document.getElementById(
    "total-eggmerge"
  ).textContent =
    Math.round(
      totals.eggmerge
    ) +
    "개";

    "total-mount"

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  currentMode =
    null;

  currentMemberId =
    null;

  currentNickname =
    "";

  members =
    [];

  localStorage.removeItem(
    "fm_mode"
  );

  localStorage.removeItem(
    "fm_member_id"
  );

  localStorage.removeItem(
    "fm_nickname"
  );


  document.getElementById(
    "login-nickname"
  ).value =
    "";

  document.getElementById(
    "login-password"
  ).value =
    "";

  document.getElementById(
    "admin-password"
  ).value =
    "";


  document.getElementById(
    "login-status"
  ).textContent =
    "";

  document.getElementById(
    "admin-login-status"
  ).textContent =
    "";


  showMemberLogin();

}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !== "Enter"
    )
      return;


    if(
      document.getElementById(
        "admin-login-screen"
      ).classList.contains(
        "hidden"
      ) === false
    ){

      adminLogin();

      return;

    }


    if(
      document.getElementById(
        "login-screen"
      ).style.display !== "none"
    ){

      memberLogin();

    }

  }
);


/* =========================================================
   START
========================================================= */

function initialStart(){

  /*
    새 버전에서는 보안상 자동 로그인하지 않는다.
    페이지를 열 때마다 비밀번호를 입력한다.
  */

  showMemberLogin();

}


/* =========================================================
   RUN
========================================================= */

initialStart();

</script>
