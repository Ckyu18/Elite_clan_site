/* =========================================================

========================================================= */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================================================
   STORAGE
========================================================= */

const SESSION_KEY =
"forge_master_session_v1";


function saveSession(){

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify({
      nickname:
        currentMember?.nickname || "",
      admin:
        isAdmin
    })
  );

}


function clearSession(){

  localStorage.removeItem(
    SESSION_KEY
  );

}


function getSession(){

  try{

    const value =
      localStorage.getItem(
        SESSION_KEY
      );

    if(!value)
      return null;

    return JSON.parse(
      value
    );

  }
  catch{

    return null;

  }

}

/* =========================================================

========================================================= */

async function restoreSession(){

  const session =
    getSession();


  if(!session){

    showLogin();

    return;

  }


  if(session.admin){

    const password =
      prompt(
        "관리자 모드 비밀번호를 입력해주세요."
      );


    if(!password){

      clearSession();

      showLogin();

      return;

    }


    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "forge_admin_login",
      {
        input_password:
          password
      }
    );


    if(
      error ||
      !data ||
      !data.success
    ){

      clearSession();

      showLogin();

      return;

    }


    currentMember = {

      nickname:
        session.nickname ||
        "관리자"

    };

    isAdmin =
      true;

    showApp();

    updateModeUI();

    await loadAllMembers(
      password
    );

    return;

  }


  const nickname =
    session.nickname;


  if(!nickname){

    clearSession();

    showLogin();

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "forge_get_member",
    {
      input_nickname:
        nickname
    }
  );


  if(
    error ||
    !data
  ){

    clearSession();

    showLogin();

    return;

  }


  currentMember =
    data;

  isAdmin =
    false;

  showApp();

  updateModeUI();

  await loadMemberData();

}

========================================================= */

async function loadMemberData(){

    !currentMember ||
    !currentMember.nickname
  )
    return;


  setStatus(
    "내 데이터를 불러오는 중..."
  );


  const {

  } =
  await supabaseClient.rpc(
    "forge_get_member",
    {
      input_nickname:
        currentMember.nickname
    }
  );


  if(error){

    console.error(error);

    setStatus(
      "데이터를 불러오지 못했습니다.",

    );

  }

/* =========================================================
   PROFILE
========================================================= */

function renderProfile(){

  if(!currentMember)
    return;


  document.getElementById(
    "profile-name"
  ).textContent =
    currentMember.nickname ||
    "-";


  const resources =
    document.getElementById(
      "profile-resources"
    );


  resources.innerHTML = `

    ${profileResource(
      "초물",
      currentMember.초물,
      "chomul"
    )}

    ${profileResource(
      "스킬",
      currentMember.스킬,
      "skill"
    )}

    ${profileResource(
      "알껍질",
      currentMember.알껍질,
      "eggshell"
    )}

    ${profileResource(
      "알합치기",
      currentMember.알합치기 + "개",
      "eggmerge"
    )}

    ${profileResource(
      "탈것",
      currentMember.탈것,
      "mount"
    )}

    ${profileResource(
      "탈것합치기",
      currentMember.탈것합치기 + "개",
      "mountmerge"
    )}

  `;

}


function profileResource(
  title,
  value,
  type
){

  const red =
    (
      type === "skill" &&
      toNumber(value) >= 50000
    ) ||
    (
      type === "eggshell" &&
      toNumber(value) >= 50000
    ) ||
    (
      type === "mount" &&
      toNumber(value) >= 30000
    );


  return `

    <div class="profile-resource">

      <div class="profile-resource-title">
        ${title}
      </div>

      <div
        class="
          profile-resource-value
          ${red ? "red-text" : ""}
        "
      >
        ${escapeHtml(value ?? "0")}
      </div>

    </div>

  `;

}


/* =========================================================
   VIEW
========================================================= */

function setView(
  view
){

  currentView =
    view;


  document
    .querySelectorAll(
      ".view-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.view ===
            view
        );

      }
    );


  const toolbar =
    document.getElementById(
      "toolbar"
    );


  const table =
    document.getElementById(
      "table-section"
    );


  if(
    view === "all"
  ){

      "flex";

    table.style.display =
      "block";

  }
  else{

    toolbar.style.display =
      "none";

  }

/* =========================================================
   SUMMARY TOGGLE
========================================================= */

function toggleSummary(){

  summaryOpen =
    !summaryOpen;


  document.getElementById(
    "summary-content"
  ).style.display =
    summaryOpen
      ? "block"
      : "none";


  document.getElementById(
    "summary-arrow"
  ).textContent =
    summaryOpen
      ? "▲"
      : "▼";

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  renderSummary();


  if(
    currentView ===
    "ascension"
  ){

    renderAscension();

    return;

  }


  if(
    currentView !==
    "all"
  ){

    renderResourceView(
      currentView
    );

    return;

  }


  renderAll();

}


/* =========================================================
   SUMMARY
========================================================= */

function renderSummary(){

  const fields = [

    ["초물","chomul"],
    ["스킬","skill"],
    ["알껍질","eggshell"],
    ["알합치기","eggmerge"],
    ["탈것","mount"],
    ["탈것합치기","mountmerge"]

  ];


  const totals = {};


  fields.forEach(
    ([title,key]) => {

      totals[key] = 0;

    }
  );


  members.forEach(
    member => {

      fields.forEach(
        ([title,key]) => {

          totals[key] +=
            toNumber(
              member[
                koreanField(key)
              ]
            );

        }
      );

    }
  );


  const grid =
    document.getElementById(
      "summary-grid"
    );


  grid.innerHTML =
    fields
      .map(
        ([title,key]) => `

          <div class="summary-item">

            <div class="summary-label">
              ${title}
            </div>

            <div class="summary-value">
              ${
                key === "eggmerge" ||
                key === "mountmerge"
                  ? Math.round(
                      totals[key]
                    ) + "개"
                  : formatNumber(
                      totals[key]
                    )
              }
            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================================
   ALL
========================================================= */

function renderAll(){

  const tbody =
    document.getElementById(
      "members"
    );


  tbody.innerHTML =
    "";


  let list =
    [...members];


  const search =
    (
      document.getElementById(
        "search"
      )?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const sort =
    document.getElementById(
      "sort"
    )?.value ||
    "default";


  if(search){

    list =
      list.filter(
        member =>
          String(
            member.nickname
          )
          .toLowerCase()
          .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>

        toNumber(
          b[
            koreanField(sort)
          ]
        )
        -
        toNumber(
          a[
            koreanField(sort)
          ]
        )

    );

  }


  if(list.length === 0){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="10"
          class="empty"
        >
          표시할 회원이 없습니다.
        </td>

      </tr>

    `;

    updateTotals();

    return;

  }


  list.forEach(
    member => {

      tbody.appendChild(
        createMemberRow(
          member
        )
      );

    }
  );


  updateTotals();

}

/* =========================================================
   RESOURCE VIEW
========================================================= */

function renderResourceView(
  type
){

  const tbody =
    document.getElementById(
      "members"
    );


  tbody.innerHTML =
    "";


  const field =
    koreanField(type);


  let list =
    [...members];


  list.sort(
    (a,b) =>
      toNumber(
        b[field]
      )
      -
      toNumber(
        a[field]
      )
  );


  if(list.length === 0){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="10"
          class="empty"
        >
          표시할 데이터가 없습니다.
        </td>

      </tr>

    `;

    return;

  }


  list.forEach(
    (member,index) => {

      const tr =
        document.createElement(
          "tr"
        );


      const value =
        member[field] ??
        0;


      const red =
        (
          type === "skill" &&
          toNumber(value) >= 50000
        ) ||
        (
          type === "eggshell" &&
          toNumber(value) >= 50000
        ) ||
        (
          type === "mount" &&
          toNumber(value) >= 30000
        );


      tr.innerHTML = `

        <td>
          ${index + 1}위
        </td>

        <td>
          -
        </td>

        <td class="name-cell">

          ${escapeHtml(
            member.nickname
          )}

        </td>

        <td
          colspan="6"
          class="${
            red ? "red" : ""
          }"
        >

          ${
            type === "eggmerge" ||
            type === "mountmerge"
              ? Math.round(
                  toNumber(value)
                ) + "개"
              : escapeHtml(
                  value || "0"
                )
          }

        </td>

        <td>
          ${formatUpdated(
            member.updated_at
          )}
        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}

/* =========================================================

========================================================= */

function editMember(
  id
){

  const member =
    members.find(
      item =>
        item.id === id

    }


    result =

          new_nickname:

            ) || 0,

          new_eggshell:
            get("eggshell"),

          new_eggshell_lv:

            ) || 0,

          new_eggmerge:
            Number(
              get("eggmerge")
            ) || 0,

          new_mount:
            get("mount"),

          new_mount_lv:
            Number(
              get("mount_lv")
            ) || 0,

          new_mountmerge:
            Number(
              get("mountmerge")
            ) || 0,

          new_s:
            getCheck("check-s"),

          new_pet:
            getCheck("check-pet"),

          new_tal:
            getCheck("check-tal")

        }
      );

  }
  else{

    const password =
      prompt(
        "공동 비밀번호를 입력해주세요."
      );


    if(!password){

      setStatus(
        "저장이 취소되었습니다."
      );

      return;

    }


    result =
      await supabaseClient.rpc(
        "forge_update_member",
        {

          input_password:
            password,

          input_nickname:
            member.nickname,

          new_nickname:
            get("name"),

          new_chomul:
            get("chomul"),

          new_skill:
            get("skill"),

          new_skill_lv:
            Number(
              get("skill_lv")
            ) || 0,

          new_eggshell:
            get("eggshell"),

          new_eggshell_lv:
            Number(
              get("eggshell_lv")
            ) || 0,

          new_eggmerge:
            Number(
              get("eggmerge")
            ) || 0,

          new_mount:
            get("mount"),

          new_mount_lv:
            Number(
              get("mount_lv")
            ) || 0,

          new_mountmerge:
            Number(
              get("mountmerge")
            ) || 0,

          new_s:
            getCheck("check-s"),

          new_pet:
            getCheck("check-pet"),

          new_tal:
            getCheck("check-tal")

        }
      );

  }


  if(
    result.error
  ){

    console.error(
      result.error
    );

    alert(
      "저장 실패\n\n" +
      result.error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;

  }


  const data =
    result.data;


  if(
    !data ||
    !data.success
  ){

    alert(
      "저장 실패\n\n" +
      (
        data?.message ||
        "알 수 없는 오류"
      )
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;

  }


  const updated =
    data.member;


  const index =
    members.findIndex(
      item =>
        item.id === id
    );


  if(index !== -1){

    members[index] =
      updated;

  }


  if(
    currentMember &&
    currentMember.id === id

    currentMember =
      updated;

  }


  editingId =
    null;


  if(!isAdmin){

    saveSession();

  }


  renderProfile();

  render();

  setStatus(
    "✅ 저장 완료",
    "success"
  );

}

/* =========================================================
   NUMBER
========================================================= */

function toNumber(
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(
      text
    );


  if(
    isNaN(number)
  )
    return 0;


  if(
    text.endsWith("m")
  ){

    number *=
      1000000;

  }
  else if(
    text.endsWith("k")
  ){

    number *=
      1000;

  }


  return number;

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(
  number
){

  if(
    number === 0
  )
    return "0";


  if(
    number >= 1000000
  ){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    ) + "m";

  }


  if(
    number >= 1000
  ){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    ) + "k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================================
   UPDATED
========================================================= */

function formatUpdated(
  value
){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff / 60000
    );


  if(minutes < 1){

    return `
      <span class="success">
        방금 수정
      </span>
    `;

  }


  if(minutes < 60){

    return (
      minutes +
      "분 전"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return (
      hours +
      "시간 전"
    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return (
      days +
      "일 전"
    );

  }


  return (
    date.getMonth() +
    1
  ) +
  "월 " +
  date.getDate() +
  "일";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}
