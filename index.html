  "sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,

  );


/* =========================================================
   STATE
========================================================= */

/* =========================================================
   ADMIN LOGIN SCREEN
========================================================= */

function showAdminLogin(){

  document.getElementById("login-screen").style.display =
    "none";

  document.getElementById("admin-login-screen").style.display =

/* =========================================================
   MEMBER LOGIN
========================================================= */

async function memberLogin(){

  const nickname =
    document.getElementById("login-nickname").value.trim();

  const password =
    document.getElementById("login-password").value.trim();

  const status =
    document.getElementById("login-status");


  if(!nickname){

    status.textContent =
      "닉네임을 입력해주세요.";

    return;

  }


  if(!password){

    status.textContent =
      "공동비밀번호를 입력해주세요.";

    return;

  }


  status.textContent =
    "접속 중...";


  try{

    /*
      공동비밀번호 확인
      ↓
      닉네임 확인
      ↓
      member_id 반환
    */

    const result =
      await supabaseClient.rpc(
        "fm_login",
        {
          p_nickname:nickname,
          p_password:password,
          p_mode:"member"
        }
      );


    if(result.error){

      status.textContent =
        "❌ " +
        result.error.message;

      return;

    }


    if(
      !result.data ||
      !result.data.success
    ){

      status.textContent =
        result.data?.message ||
        "접속할 수 없습니다.";

      return;

    }


    currentMode =
      "member";

    currentMemberId =
      Number(result.data.member_id);

    currentNickname =
      result.data.nickname ||
      nickname;


    await startApp();

  }
  catch(error){

    console.error(error);

    status.textContent =
      "❌ " + error.message;

  }

}


/* =========================================================
   ADMIN LOGIN
========================================================= */

/* =========================================================
   START APP
========================================================= */

async function startApp(){

  document.getElementById("login-screen").style.display =
    "none";

  document.getElementById("admin-login-screen").style.display =
    "none";

  document.getElementById("app").style.display =
    "block";


  updateModeUI();

  await loadMembers();

}


/* =========================================================
   MODE UI
========================================================= */

function updateModeUI(){

  const badge =
    document.getElementById("mode-badge");

  const myName =
    document.getElementById("my-name");

  const myMode =
    document.getElementById("my-mode");

  const passwordPanel =
    document.getElementById("password-panel");

  const adminPanel =
    document.getElementById("admin-panel");


  if(currentMode === "admin"){

    badge.innerHTML =
      `
      <div class="admin-badge">
        👑 관리자
      </div>
      `;

    myName.textContent =
      "전체 클랜원";

    myMode.textContent =
      "전체 클랜원의 정보를 관리할 수 있습니다.";

    passwordPanel.classList.remove("hidden");

    adminPanel.classList.remove("hidden");

  }
  else{

    badge.innerHTML =
      "";

    myName.textContent =
      currentNickname;

    myMode.textContent =
      "본인의 정보만 표시됩니다.";

    passwordPanel.classList.add("hidden");

    adminPanel.classList.add("hidden");

  }

}


/* =========================================================
   LOAD MEMBERS
========================================================= */

async function loadMembers(){

  setStatus(
    "데이터를 불러오는 중..."
  );


  try{

    const result =
      await supabaseClient.rpc(
        "fm_get_members",
        {
          p_mode:currentMode,
          p_member_id:currentMemberId
        }
      );


    if(result.error){

      console.error(result.error);

      setStatus(
        "❌ 데이터를 불러오지 못했습니다: " +
        result.error.message,
        "error"
      );

      return;

    }


    members =
      (result.data || [])
        .map(normalizeMember);


    render();


    if(currentMode === "admin"){

      document.getElementById(
        "member-count"
      ).textContent =
        members.length + "명";

    }


    setStatus(
      currentMode === "admin"
        ? "✅ 전체 클랜원 불러오기 완료"
        : "✅ 내 정보 불러오기 완료",
      "success"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "❌ " + error.message,
      "error"
    );

  }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeMember(row){

  return {

    id:
      row.id,

    name:
      row.nickname || "",

    chomul:
      row.chomul || "",

    skill:
      row.skill || "",

    skill_lv:
      Number(row.skill_lv || 0),

    eggshell:
      row.eggshell || "",

    eggshell_lv:
      Number(row.eggshell_lv || 0),

    eggmerge:
      Number(row.eggmerge || 0),

    mount:
      row.mount || "",

    mount_lv:
      Number(row.mount_lv || 0),

    mountmerge:
      Number(row.mountmerge || 0),

    asc_skill:
      Boolean(row.asc_skill),

    asc_pet:
      Boolean(row.asc_pet),

    asc_mount:
      Boolean(row.asc_mount),

    updated_at:
      row.updated_at

  };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const tbody =
    document.getElementById("members");

  tbody.innerHTML =
    "";


  let list =
    [...members];


  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const sort =
    document.getElementById("sort").value;


  if(search){

    list =
      list.filter(
        member =>
          member.name
            .toLowerCase()
            .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(b[sort]) -
        toNumber(a[sort])
    );

  }


  if(currentView === "ascension"){

    list =
      list.filter(
        member =>
          member.asc_skill ||
          member.asc_pet ||
          member.asc_mount
      );

  }


  if(list.length === 0){

    tbody.innerHTML =
      `
      <tr>
        <td
          colspan="9"
          class="empty"
        >
          표시할 클랜원이 없습니다.
        </td>
      </tr>
      `;

    updateTotals();

    applyTotalState();

    return;

  }


  list.forEach(member => {

    const realIndex =
      members.findIndex(
        item =>
          Number(item.id) ===
          Number(member.id)
      );


    const tr =
      document.createElement("tr");


    tr.innerHTML =
      buildRow(
        member,
        realIndex
      );


    tbody.appendChild(tr);

  });


  updateTotals();

  applyTotalState();

  applyColors();

}

/* =========================================================
   VIEW
========================================================= */

function setView(view){

  currentView =
    view;


  document
    .querySelectorAll(".view-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.view === view
      );

    });


  if(view === "all"){

    totalOpen =
      !totalOpen;

    applyTotalState();

    render();

    return;

  }


  totalOpen =
    true;

  applyTotalState();

  render();

}


/* =========================================================
   TOTAL STATE
========================================================= */

function applyTotalState(){

  const tbody =
    document.getElementById("members");

  const totalPanel =
    document.getElementById("total-panel");


  if(
    currentView === "all" &&
    !totalOpen
  ){

    tbody.style.display =
      "none";

    totalPanel.style.display =
      "block";

    return;

  }


  tbody.style.display =
    "";

  totalPanel.style.display =
    currentView === "all"
      ? "block"
      : "none";

}


/* =========================================================
   EDIT
========================================================= */

function editMember(index){

  const member =
    members[index];


  if(!member)
    return;


  if(
    currentMode !== "admin" &&
    Number(member.id) !==
      Number(currentMemberId)
  ){

    alert(
      "수정 권한이 없습니다."
    );

    return;

  }


  const fields = [

    "name",
    "chomul",

    "skill_lv",
    "skill",

    "eggshell_lv",
    "eggshell",
    "eggmerge",

    "mount_lv",
    "mount",
    "mountmerge"

  ];


  fields.forEach(field => {

    const el =
      document.getElementById(
        field + "-" + index
      );

    if(el)
      el.disabled = false;

  });


  document.getElementById(
    "edit-" + index
  ).style.display =
    "none";


  document.getElementById(
    "save-" + index
  ).style.display =
    "inline-block";

}


/* =========================================================
   SAVE
========================================================= */

async function saveMember(index){

  const member =
    members[index];


  if(!member)
    return;


  const getValue =
    field => {

      const el =
        document.getElementById(
          field + "-" + index
        );

      return el
        ? el.value.trim()
        : "";

    };


  const getCheck =
    id => {

      const el =
        document.getElementById(
          id + "-" + index
        );

      return el
        ? el.checked
        : false;

    };


  setStatus(
    "💾 저장 중..."
  );


  try{

    const result =
      await supabaseClient.rpc(
        "fm_update_member",
        {

          p_mode:
            currentMode,

          p_member_id:
            member.id,

          p_nickname:
            getValue("name"),

          p_chomul:
            getValue("chomul"),

          p_skill:
            getValue("skill"),

          p_skill_lv:
            Number(
              getValue("skill_lv")
            ) || 0,

          p_eggshell:
            getValue("eggshell"),

          p_eggshell_lv:
            Number(
              getValue("eggshell_lv")
            ) || 0,

          p_eggmerge:
            Number(
              getValue("eggmerge")
            ) || 0,

          p_mount:
            getValue("mount"),

          p_mount_lv:
            Number(
              getValue("mount_lv")
            ) || 0,

          p_mountmerge:
            Number(
              getValue("mountmerge")
            ) || 0,

          p_s:
            getCheck("check_s"),

          p_pet:
            getCheck("check_pet"),

          p_tal:
            getCheck("check_tal")

        }
      );


    if(result.error){

      alert(
        "저장 실패\n\n" +
        result.error.message
      );

      setStatus(
        "❌ 저장 실패",
        "error"
      );

      return;

    }


    if(!result.data){

      alert(
        "저장 결과를 받지 못했습니다."
      );

      return;

    }


    members[index] =
      normalizeMember(
        result.data
      );


    if(
      Number(member.id) ===
      Number(currentMemberId)
    ){

      currentNickname =
        members[index].name;

      document.getElementById(
        "my-name"
      ).textContent =
        currentNickname;

    }


    render();


    setStatus(
      "✅ 저장 완료",
      "success"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "저장 실패\n\n" +
      error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMember(index){

  if(currentMode !== "admin"){

    alert(
      "관리자만 삭제할 수 있습니다."
    );

    return;

  }


  const member =
    members[index];


  if(!member)
    return;


  const ok =
    confirm(
      `"${member.name}" 클랜원을 삭제하시겠습니까?\n\n삭제 후 복구할 수 없습니다.`
    );


  if(!ok)
    return;


  setStatus(
    "🗑️ 삭제 중..."
  );


  try{

    const result =
      await supabaseClient.rpc(
        "fm_delete_member",
        {
          p_member_id:
            member.id
        }
      );


    if(result.error){

      alert(
        "삭제 실패\n\n" +
        result.error.message
      );

      setStatus(
        "❌ 삭제 실패",
        "error"
      );

      return;

    }


    if(
      result.data &&
      result.data.success === false
    ){

      alert(
        result.data.message ||
        "삭제할 수 없습니다."
      );

      setStatus(
        "❌ 삭제 실패",
        "error"
      );

      return;

    }


    members =
      members.filter(
        m =>
          Number(m.id) !==
          Number(member.id)
      );


    document.getElementById(
      "member-count"
    ).textContent =
      members.length + "명";


    render();


    setStatus(
      "✅ 삭제 완료",
      "success"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "삭제 실패\n\n" +
      error.message
    );

    setStatus(
      "❌ 삭제 실패",
      "error"
    );

  }

}


/* =========================================================
   ASCENSION CHECK
========================================================= */

async function toggleCheck(
  index,
  type
){

  const member =
    members[index];


  if(!member)
    return;


  if(
    currentMode !== "admin" &&
    Number(member.id) !==
      Number(currentMemberId)
  ){

    alert(
      "수정 권한이 없습니다."
    );

    render();

    return;

  }


  const checkboxId = {

    skill:
      "check_s-",

    pet:
      "check_pet-",

    mount:
      "check_tal-"

  }[type];


  const checkbox =
    document.getElementById(
      checkboxId + index
    );


  if(!checkbox)
    return;


  const oldSkill =
    member.asc_skill;

  const oldPet =
    member.asc_pet;

  const oldMount =
    member.asc_mount;


  if(type === "skill")
    member.asc_skill =
      checkbox.checked;


  if(type === "pet")
    member.asc_pet =
      checkbox.checked;


  if(type === "mount")
    member.asc_mount =
      checkbox.checked;


  try{

    const result =
      await supabaseClient.rpc(
        "fm_update_member",
        {

          p_mode:
            currentMode,

          p_member_id:
            member.id,

          p_nickname:
            member.name,

          p_chomul:
            member.chomul,

          p_skill:
            member.skill,

          p_skill_lv:
            member.skill_lv,

          p_eggshell:
            member.eggshell,

          p_eggshell_lv:
            member.eggshell_lv,

          p_eggmerge:
            member.eggmerge,

          p_mount:
            member.mount,

          p_mount_lv:
            member.mount_lv,

          p_mountmerge:
            member.mountmerge,

          p_s:
            member.asc_skill,

          p_pet:
            member.asc_pet,

          p_tal:
            member.asc_mount

        }
      );


    if(result.error){

      member.asc_skill =
        oldSkill;

      member.asc_pet =
        oldPet;

      member.asc_mount =
        oldMount;


      alert(
        "체크 저장 실패\n\n" +
        result.error.message
      );

      render();

      return;

    }


    members[index] =
      normalizeMember(
        result.data
      );


    render();

  }
  catch(error){

    member.asc_skill =
      oldSkill;

    member.asc_pet =
      oldPet;

    member.asc_mount =
      oldMount;


    console.error(error);

    alert(
      "체크 저장 실패\n\n" +
      error.message
    );

    render();

  }

}


/* =========================================================
   COLOR
========================================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  input.classList.remove(
    "red"
  );


  const value =
    toNumber(
      input.value
    );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}

/* =========================================================
   NUMBER
========================================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  )
    return 0;


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(/,/g,"");


  let number =
    parseFloat(text);


  if(isNaN(number))
    return 0;


  if(text.endsWith("m")){

    number *= 1000000;

  }
  else if(text.endsWith("k")){

    number *= 1000;

  }


  return number;

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(number){

  if(!number)
    return "0";


  if(number >= 1000000){

    return Number(
      (number / 1000000)
        .toFixed(2)
    ) + "m";

  }


  if(number >= 1000){

    return Number(
      (number / 1000)
        .toFixed(2)
    ) + "k";

  }


  return Math.round(number)
    .toString();

}


/* =========================================================
   UPDATED
========================================================= */

function formatUpdated(value){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(isNaN(date.getTime()))
    return "-";


  const minutes =
    Math.floor(
      (
        Date.now() -
        date.getTime()
      ) / 60000
    );


  if(minutes < 1)
    return "방금";


  if(minutes < 60)
    return minutes + "분";


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24)
    return hours + "시간";


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7)
    return days + "일";


  return (
    date.getMonth() + 1
  ) +
  "/" +
  date.getDate();

}


/* =========================================================

function updateTotals(){

    skill:0,

    eggshell:0,

    eggmerge:0,

    mount:0,

    mountmerge:0

  };


  members.forEach(member => {

    totals.chomul +=
      toNumber(member.chomul);

    totals.skill +=
      toNumber(member.skill);

    totals.eggshell +=
      toNumber(member.eggshell);

    totals.eggmerge +=
      Number(member.eggmerge || 0);

    totals.mount +=
      toNumber(member.mount);

    totals.mountmerge +=
      Number(member.mountmerge || 0);

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}
