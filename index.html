<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forge Master Clan Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d18;
    color: #f8fafc;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* 상단 */
.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 38px;
}

h1 {
    margin: 8px 0;
    font-size: 28px;
}

.subtitle {
    color: #94a3b8;
    margin: 0;
}

/* 통계 */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.stat {
    background: #111a2b;
    border: 1px solid #263550;
    border-radius: 14px;
    padding: 15px 8px;
    text-align: center;
}

.stat-icon {
    font-size: 22px;
}

.stat-number {
    display: block;
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}
