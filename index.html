<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Clan</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
}

.card {
    background: #1e293b;
    padding: 20px;
    margin-top: 20px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.card h2 {
    margin-top: 0;
    color: #60a5fa;
}

.member {
    background: #334155;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    background: #2563eb;
}
</style>
</head>

<body>

<div class="container">

    <h1>🔥 Elite Clan</h1>

    <p class="subtitle">
        우리 클랜 정보
    </p>

    <div class="card">
        <h2>📊 클랜 정보</h2>

        <p>클랜 레벨 : <strong>10</strong></p>
        <p>클랜원 : <strong>25명</strong></p>
        <p>클랜 포인트 : <strong>125,000</strong></p>
    </div>

    <div class="card">
        <h2>👥 클랜원</h2>

        <div class="member">김철수</div>
        <div class="member">홍길동</div>
        <div class="member">이영희</div>
        <div class="member">박민수</div>
    </div>

    <div class="card">
        <h2>🏆 클랜 상태</h2>

        <p>현재 상태 : 🟢 활동 중</p>
        <p>이번 주 순위 : 12위</p>
    </div>

    <button onclick="location.reload()">
        🔄 새로고침
    </button>

</div>

</body>
</html>
