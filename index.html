<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#080d18">
<meta name="description" content="Forge Master ELITE 클랜 재화 현황">

<meta property="og:title" content="⚒️ Forge Master ELITE 클랜">
<meta property="og:description" content="ELITE 클랜원 재화 현황">

<title>⚒️ Forge Master ELITE 클랜</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080d18;
  color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:12px;
}

.header{
  text-align:center;
  padding:10px 0 16px;
}

.logo{
  font-size:36px;
}

h1{
  margin:3px 0;
  font-size:24px;
}

.subtitle{
  margin:4px 0;
  color:#94a3b8;
  font-size:13px;
}

.notice{
  background:#111a2b;
  border:1px solid #263550;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  color:#cbd5e1;
  font-size:12px;
  line-height:1.7;
}

.notice b{
  color:#60a5fa;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:180px;
  padding:11px 12px;
  border-radius:9px;
  border:1px solid #334155;
  background:#111a2b;
  color:white;
  font-size:14px;
}

.sort{
  padding:11px 10px;
  border-radius:9px;
  border:1px solid #334155;
  background:#111a2b;
  color:white;
  font-size:13px;
}

.status{
  text-align:center;
  min-height:20px;
  margin:8px 0;
  color:#94a3b8;
  font-size:12px;
}

.success{
  color:#4ade80;
}

.error{
  color:#f87171;
}

.table-wrap{
  overflow-x:auto;
  background:#111a2b;
  border:1px solid #263550;
  border-radius:14px;
  -webkit-overflow-scrolling:touch;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1200px;
}

th{
  background:#18243a;
  color:#c8d8ef;
  padding:11px 7px;
  font-size:12px;
  white-space:nowrap;
  position:sticky;
  top:0;
  z-index:3;
  cursor:pointer;
}

th:hover{
  background:#20304c;
}

td{
  padding:7px 6px;
  border-top:1px solid #263550;
  text-align:center;
  white-space:nowrap;
  font-size:12px;
}

td:first-child{
  position:sticky;
  left:0;
  background:#111a2b;
  z-index:2;
  text-align:left;
  font-weight:bold;
}

input{
  width:75px;
  padding:8px 5px;
  border:1px solid #334155;
  border-radius:7px;
  background:#080d18;
  color:white;
  text-align:center;
  font-size:12px;
}

input[id^="name-"]{
  width:105px;
  text-align:left;
}

input:focus{
  outline:none;
  border-color:#3b82f6;
}

.red{
  color:#ff4d4d!important;
  font-weight:800;
  background:#180d13!important;
  border-color:#7f1d1d!important;
}

.edit-btn,
.save-btn{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  color:white;
  font-size:12px;
  font-weight:800;
  min-width:60px;
  cursor:pointer;
}

.edit-btn{
  background:#2563eb;
}

.save-btn{
  display:none;
  background:#16a34a;
}

.rank{
  color:#fbbf24;
  font-weight:900;
}

.recent{
  color:#4ade80;
  font-size:10px;
}

.total{
  background:#1d293d;
  font-weight:bold;
}

.total td{
  font-size:12px;
  border-top:2px solid #3b4d6b;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:11px;
  padding:16px 0;
}

@media(max-width:600px){

  .container{
    padding:8px;
  }

  .logo{
    font-size:31px;
  }

  h1{
    font-size:21px;
  }

  .toolbar{
    flex-direction:column;
  }

  .search,
  .sort{
    width:100%;
  }

  .notice{
    font-size:11px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">⚒️</div>
    <h1>Forge Master</h1>
    <p class="subtitle">ELITE 클랜 재화 현황</p>
  </div>

  <div class="notice">
    <b>📌 재화 입력</b><br>
    k / m 단위 사용 가능<br>
    🔴 스킬 50k 이상 · 알껍질 50k 이상 · 탈것 30k 이상<br>
    알합치기 · 탈것합치기는 개 단위
  </div>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="🔍 닉네임 검색"
      oninput="render()">

    <select
      id="sort"
      class="sort"
      onchange="render()">

      <option value="default">
        기본 순서
      </option>

      <option value="skill">
        스킬 높은순
      </option>

      <option value="eggshell">
        알껍질 높은순
      </option>

      <option value="mount">
        탈것 높은순
      </option>

      <option value="gold">
        골드 높은순
      </option>

      <option value="hammer">
        망치 높은순
      </option>

      <option value="chomul">
        초물 높은순
      </option>

      <option value="eggmerge">
        알합치기 높은순
      </option>

      <option value="mountmerge">
        탈것합치기 높은순
      </option>

    </select>

  </div>

  <div id="status" class="status">
    데이터를 불러오는 중...
  </div>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>닉네임</th>
          <th>초물</th>
          <th>스킬</th>
          <th>알껍질</th>
          <th>알합치기</th>
          <th>탈것</th>
          <th>탈것합치기</th>
          <th>골드</th>
          <th>망치</th>
          <th>최근 수정</th>
          <th>관리</th>

        </tr>

      </thead>

      <tbody id="members"></tbody>

      <tfoot>

        <tr class="total">

          <td>합계</td>

          <td id="total-chomul">0</td>

          <td id="total-skill">0</td>

          <td id="total-eggshell">0</td>

          <td id="total-eggmerge">0개</td>

          <td id="total-mount">0</td>

          <td id="total-mountmerge">0개</td>

          <td id="total-gold">0</td>

          <td id="total-hammer">0</td>

          <td>-</td>

          <td>-</td>

        </tr>

      </tfoot>

    </table>

  </div>

  <div class="footer">
    ⚒️ Forge Master ELITE
  </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   DATA
========================= */

let members=[];


/* =========================
   LOAD
========================= */

async function loadMembers(){

  setStatus("데이터를 불러오는 중...");

  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .select("*")
    .order("id",{ascending:true});

  if(error){

    console.error(error);

    setStatus(
      "데이터 불러오기 실패",
      "error"
    );

    return;
  }

  members =
    (data || []).map(row => ({

      id:row.id,

      name:row.nickname || "",

      chomul:row.초물 || "",

      skill:row.스킬 || "",

      eggshell:row.알껍질 || "",

      eggmerge:row.알합치기 ?? 0,

      mount:row.탈것 || "",

      mountmerge:row.탈것합치기 ?? 0,

      gold:row.골드 || "",

      hammer:row.망치 || "",

      updated_at:
        row.updated_at || null

    }));

  render();

  setStatus(
    "🟢 실시간 연결됨 · "+
    members.length+
    "명",
    "success"
  );

}


/* =========================
   REALTIME
========================= */

supabaseClient
  .channel("clan-members-live")
  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"clan_members"
    },
    payload => {

      console.log(
        "실시간 변경:",
        payload
      );

      loadMembers();

    }
  )
  .subscribe(
    status => {

      console.log(
        "Realtime:",
        status
      );

    }
  );


/* =========================
   RENDER
========================= */

function render(){

  const tbody =
    document.getElementById(
      "members"
    );

  tbody.innerHTML="";

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const sort =
    document
      .getElementById("sort")
      .value;


  let list =
    [...members];


  if(search){

    list =
      list.filter(member =>
        member.name
          .toLowerCase()
          .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(b[sort]) -
        toNumber(a[sort])
    );

  }


  list.forEach(
    (member,index)=>{

      const originalIndex =
        members.findIndex(
          x => x.id === member.id
        );

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>

          <span class="rank">
            ${sort !== "default" ? (index+1)+"위 " : ""}
          </span>

          <input
            id="name-${originalIndex}"
            value="${escapeHtml(member.name)}"
            disabled>

        </td>

        <td>
          <input
            id="chomul-${originalIndex}"
            value="${escapeHtml(member.chomul)}"
            disabled>
        </td>

        <td>
          <input
            id="skill-${originalIndex}"
            value="${escapeHtml(member.skill)}"
            disabled
            oninput="checkColor(this,'skill')">
        </td>

        <td>
          <input
            id="eggshell-${originalIndex}"
            value="${escapeHtml(member.eggshell)}"
            disabled
            oninput="checkColor(this,'eggshell')">
        </td>

        <td>
          <input
            id="eggmerge-${originalIndex}"
            type="number"
            value="${member.eggmerge}"
            disabled>
        </td>

        <td>
          <input
            id="mount-${originalIndex}"
            value="${escapeHtml(member.mount)}"
            disabled
            oninput="checkColor(this,'mount')">
        </td>

        <td>
          <input
            id="mountmerge-${originalIndex}"
            type="number"
            value="${member.mountmerge}"
            disabled>
        </td>

        <td>
          <input
            id="gold-${originalIndex}"
            value="${escapeHtml(member.gold)}"
            disabled>
        </td>

        <td>
          <input
            id="hammer-${originalIndex}"
            value="${escapeHtml(member.hammer)}"
            disabled>
        </td>

        <td>
          ${formatUpdated(member.updated_at)}
        </td>

        <td>

          <button
            class="edit-btn"
            id="edit-${originalIndex}"
            onclick="editMember(${originalIndex})">
            수정
          </button>

          <button
            class="save-btn"
            id="save-${originalIndex}"
            onclick="saveMember(${originalIndex})">
            저장
          </button>

        </td>

      `;


      tbody.appendChild(tr);


      checkColor(
        document.getElementById(
          "skill-"+originalIndex
        ),
        "skill"
      );

      checkColor(
        document.getElementById(
          "eggshell-"+originalIndex
        ),
        "eggshell"
      );

      checkColor(
        document.getElementById(
          "mount-"+originalIndex
        ),
        "mount"
      );

    }
  );


  updateTotals();

}


/* =========================
   EDIT
========================= */

function editMember(index){

  const fields=[

    "name",
    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge",
    "gold",
    "hammer"

  ];


  fields.forEach(field=>{

    const input =
      document.getElementById(
        field+"-"+index
      );

    if(input)
      input.disabled=false;

  });


  document.getElementById(
    "edit-"+index
  ).style.display="none";


  document.getElementById(
    "save-"+index
  ).style.display="inline-block";


  setStatus(
    "수정 중입니다..."
  );

}


/* =========================
   SAVE
========================= */

async function saveMember(index){

  const member =
    members[index];


  const get =
    field =>
      document
        .getElementById(
          field+"-"+index
        )
        .value
        .trim();


  const updateData={

    nickname:get("name"),

    초물:get("chomul"),

    스킬:get("skill"),

    알껍질:get("eggshell"),

    알합치기:
      Number(get("eggmerge")) || 0,

    탈것:get("mount"),

    탈것합치기:
      Number(get("mountmerge")) || 0,

    골드:get("gold"),

    망치:get("hammer"),

    updated_at:
      new Date().toISOString()

  };


  setStatus(
    "💾 저장 중..."
  );


  const {
    error
  } =
  await supabaseClient
    .from("clan_members")
    .update(updateData)
    .eq("id",member.id);


  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n"+
      error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;
  }


  Object.assign(
    member,
    {
      name:updateData.nickname,
      chomul:updateData.초물,
      skill:updateData.스킬,
      eggshell:updateData.알껍질,
      eggmerge:updateData.알합치기,
      mount:updateData.탈것,
      mountmerge:updateData.탈것합치기,
      gold:updateData.골드,
      hammer:updateData.망치,
      updated_at:updateData.updated_at
    }
  );


  render();


  setStatus(
    "✅ 저장 완료 · 실시간 반영됨",
    "success"
  );

}


/* =========================
   COLOR
========================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(input.value);


  input.classList.remove("red");


  if(
    type==="skill" &&
    value>=50000
  )
    input.classList.add("red");


  if(
    type==="eggshell" &&
    value>=50000
  )
    input.classList.add("red");


  if(
    type==="mount" &&
    value>=30000
  )
    input.classList.add("red");

}


/* =========================
   NUMBER
========================= */

function toNumber(value){

  if(!value)
    return 0;


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(/,/g,"");


  let number =
    parseFloat(text);


  if(isNaN(number))
    return 0;


  if(text.endsWith("m"))
    number*=1000000;

  else if(text.endsWith("k"))
    number*=1000;


  return number;

}


/* =========================
   FORMAT
========================= */

function formatNumber(number){

  if(number===0)
    return "0";


  if(number>=1000000)
    return Number(
      (number/1000000).toFixed(2)
    )+"m";


  if(number>=1000)
    return Number(
      (number/1000).toFixed(2)
    )+"k";


  return Math.round(number)+"";

}


/* =========================
   UPDATED TIME
========================= */

function formatUpdated(value){

  if(!value)
    return "-";


  const date =
    new Date(value);


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff/60000
    );


  if(minutes < 1)
    return `<span class="recent">방금 수정</span>`;


  if(minutes < 60)
    return minutes+"분 전";


  const hours =
    Math.floor(
      minutes/60
    );


  if(hours < 24)
    return hours+"시간 전";


  const days =
    Math.floor(
      hours/24
    );


  return days+"일 전";

}


/* =========================
   TOTAL
========================= */

function updateTotals(){

  const fields=[

    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge",
    "gold",
    "hammer"

  ];


  const totals={};


  fields.forEach(
    field=>{
      totals[field]=0;
    }
  );


  members.forEach(member=>{

    fields.forEach(field=>{

      totals[field]+=
        toNumber(
          member[field]
        );

    });

  });


  document.getElementById(
    "total-chomul"
  ).textContent=
    formatNumber(
      totals.chomul
    );


  document.getElementById(
    "total-skill"
  ).textContent=
    formatNumber(
      totals.skill
    );


  document.getElementById(
    "total-eggshell"
  ).textContent=
    formatNumber(
      totals.eggshell
    );


  document.getElementById(
    "total-eggmerge"
  ).textContent=
    Math.round(
      totals.eggmerge
    )+"개";


  document.getElementById(
    "total-mount"
  ).textContent=
    formatNumber(
      totals.mount
    );


  document.getElementById(
    "total-mountmerge"
  ).textContent=
    Math.round(
      totals.mountmerge
    )+"개";


  document.getElementById(
    "total-gold"
  ).textContent=
    formatNumber(
      totals.gold
    );


  document.getElementById(
    "total-hammer"
  ).textContent=
    formatNumber(
      totals.hammer
    );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================
   STATUS
========================= */

function setStatus(
  text,
  type=""
){

  const el =
    document.getElementById(
      "status"
    );


  el.textContent=text;

  el.className=
    "status "+type;

}


/* =========================
   START
========================= */

loadMembers();

</script>

</body>
</html>
