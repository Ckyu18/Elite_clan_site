<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>⚒️ Forge Master ELITE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#080d18;
  color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* LOGIN */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:360px;
  background:#111a2b;
  border:1px solid #263550;
  border-radius:16px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.login-logo{font-size:42px}

.login-box h2{
  margin:8px 0 4px;
}

.login-box p{
  color:#94a3b8;
  font-size:12px;
  margin:0 0 20px;
}

.login-box input{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  font-size:14px;
  text-align:left;
  border:1px solid #334155;
  border-radius:8px;
  background:#080d18;
  color:white;
}

.login-box input:focus{
  outline:none;
  border-color:#3b82f6;
}

.login-box button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.login-box button:disabled{opacity:.6}

#login-status{
  min-height:18px;
  margin-top:12px;
  font-size:12px;
  color:#f87171;
}

/* APP */
#app{display:none}

.container{
  max-width:1500px;
  margin:auto;
  padding:10px;
}

.header{
  position:relative;
  text-align:center;
  padding:10px 0 14px;
}

.logo{font-size:34px}

h1{
  margin:2px 0;
  font-size:23px;
}

.subtitle{
  margin:3px 0;
  color:#94a3b8;
  font-size:12px;
}

.logout-btn{
  position:absolute;
  right:0;
  top:10px;
  border:1px solid #334155;
  background:#111a2b;
  color:#cbd5e1;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  cursor:pointer;
}

/* NOTICE */
.notice{
  background:#111a2b;
  border:1px solid #263550;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  color:#cbd5e1;
  font-size:11px;
  line-height:1.6;
}

.notice b{color:#60a5fa}

/* TOOLBAR */
.toolbar{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.search{
  flex:1;
  min-width:0;
  padding:10px;
  border-radius:8px;
  border:1px solid #334155;
  background:#111a2b;
  color:white;
  font-size:13px;
}

.sort{
  padding:10px;
  border-radius:8px;
  border:1px solid #334155;
  background:#111a2b;
  color:white;
  font-size:12px;
}

/* STATUS */
.status{
  text-align:center;
  min-height:18px;
  margin:6px 0;
  color:#94a3b8;
  font-size:11px;
}

.success{color:#4ade80}
.error{color:#f87171}

/* TABLE */
.table-wrap{
  overflow-x:auto;
  background:#111a2b;
  border:1px solid #263550;
  border-radius:12px;
  -webkit-overflow-scrolling:touch;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1250px;
}

th{
  background:#18243a;
  color:#c8d8ef;
  padding:9px 5px;
  font-size:11px;
  white-space:nowrap;
  position:sticky;
  top:0;
  z-index:3;
}

td{
  padding:6px 4px;
  border-top:1px solid #263550;
  text-align:center;
  white-space:nowrap;
  font-size:11px;
}

.name-cell{text-align:left}

/* INPUT */
input{
  width:65px;
  padding:7px 4px;
  border:1px solid #334155;
  border-radius:6px;
  background:#080d18;
  color:white;
  text-align:center;
  font-size:11px;
}

.name-input{
  width:90px;
  text-align:left;
}

input:focus{
  outline:none;
  border-color:#3b82f6;
  box-shadow:0 0 0 2px rgba(59,130,246,.15);
}

input:disabled{opacity:1}

/* CHECK */
.check-group{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  gap:5px;
  padding:2px 8px;
  min-width:70px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:5px;
  cursor:pointer;
  color:#e2e8f0;
  font-size:11px;
  font-weight:700;
}

.checkbox{
  width:18px;
  height:18px;
  margin:0;
  accent-color:#22c55e;
  cursor:pointer;
}

.check-header{
  display:flex;
  flex-direction:column;
  gap:3px;
  margin-top:4px;
  color:#94a3b8;
  font-size:9px;
}

/* RESOURCE */
.resource-box{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.lv-label{
  color:#94a3b8;
  font-size:10px;
  font-weight:800;
}

.lv-input{
  width:40px;
  min-width:40px;
  padding:7px 2px;
}

.resource-input{
  width:65px;
  min-width:65px;
}

/* RED */
.red{
  color:#ff4d4d !important;
  font-weight:900;
  background:#180d13 !important;
  border-color:#7f1d1d !important;
}

/* BUTTON */
.edit-btn,
.save-btn{
  border:0;
  border-radius:7px;
  padding:8px 9px;
  color:white;
  font-size:11px;
  font-weight:800;
  min-width:48px;
  cursor:pointer;
  touch-action:manipulation;
}

.edit-btn{background:#2563eb}

.save-btn{
  display:none;
  background:#16a34a;
}

/* LAST */
.recent{
  color:#4ade80;
  font-weight:800;
}

.rank{
  color:#fbbf24;
  font-weight:900;
}

/* TOTAL */
.total{
  background:#1d293d;
  font-weight:bold;
}

.total td{
  border-top:2px solid #3b4d6b;
  font-size:11px;
}

/* MOBILE */
@media(max-width:600px){

  .container{padding:7px}

  .logo{font-size:30px}

  h1{font-size:20px}

  .logout-btn{
    position:static;
    margin-top:8px;
  }

  .toolbar{
    flex-direction:column;
  }

  .search,
  .sort{
    width:100%;
  }

  th{padding:9px 5px}

  td{padding:5px 4px}

  input{padding:8px 3px}

  .edit-btn,
  .save-btn{
    padding:9px 9px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">

    <div class="login-logo">⚒️</div>

    <h2>Forge Master ELITE</h2>

    <p>클랜 관리 시스템</p>

    <input
      id="login-email"
      type="email"
      placeholder="이메일"
      autocomplete="username"
    >

    <input
      id="login-password"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="login-button" onclick="login()">
      로그인
    </button>

    <div id="login-status"></div>

  </div>
</div>

<!-- APP -->
<div id="app">

<div class="container">

  <div class="header">

    <div class="logo">⚒️</div>

    <h1>Forge Master</h1>

    <div class="subtitle">
      ELITE 클랜 재화 현황
    </div>

    <button class="logout-btn" onclick="logout()">
      로그아웃
    </button>

  </div>

  <div class="notice">

    <b>📌 입력 방법</b>

    <br>

    k / m 단위 사용 가능

    <br>

    🔴 스킬 50k 이상 · 알껍질 50k 이상 · 탈것 30k 이상

    <br>

    알합치기 · 탈것합치기는 개 단위

  </div>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="🔍 닉네임 검색"
      oninput="render()"
    >

    <select
      id="sort"
      class="sort"
      onchange="render()"
    >

      <option value="default">기본 순서</option>
      <option value="chomul">초물 높은순</option>
      <option value="skill">스킬 높은순</option>
      <option value="eggshell">알껍질 높은순</option>
      <option value="eggmerge">알합치기 높은순</option>
      <option value="mount">탈것 높은순</option>
      <option value="mountmerge">탈것합치기 높은순</option>

    </select>

  </div>

  <div id="status" class="status">
    데이터를 불러오는 중...
  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>

          <th>수정</th>

          <!-- 승천대기 + 그 밑 스/펫/탈 -->
          <th>
            승천대기

            <div class="check-header">
              <span>스</span>
              <span>펫</span>
              <span>탈</span>
            </div>
          </th>

          <th>닉네임</th>
          <th>초물</th>
          <th>스킬</th>
          <th>알껍질</th>
          <th>알합치기</th>
          <th>탈것</th>
          <th>탈것합치기</th>
          <th>마지막 수정</th>

        </tr>
      </thead>

      <tbody id="members"></tbody>

      <tfoot>

        <tr class="total">

          <td>합계</td>
          <td>-</td>
          <td>-</td>

          <td id="total-chomul">0</td>
          <td id="total-skill">0</td>
          <td id="total-eggshell">0</td>
          <td id="total-eggmerge">0개</td>
          <td id="total-mount">0</td>
          <td id="total-mountmerge">0개</td>
          <td>-</td>

        </tr>

      </tfoot>

    </table>

  </div>

</div>
</div>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* DATA */

let members = [];

const DRAFT_KEY =
"elite_clan_draft_v2";


/* LOGIN UI */

function showLogin(){

  document.getElementById("login-screen").style.display =
    "flex";

  document.getElementById("app").style.display =
    "none";
}


function showApp(){

  document.getElementById("login-screen").style.display =
    "none";

  document.getElementById("app").style.display =
    "block";
}


/* LOGIN */

async function login(){

  const email =
    document.getElementById("login-email").value.trim();

  const password =
    document.getElementById("login-password").value;

  const status =
    document.getElementById("login-status");

  const button =
    document.getElementById("login-button");


  if(!email || !password){

    status.textContent =
      "이메일과 비밀번호를 입력해주세요.";

    return;
  }


  status.textContent =
    "로그인 중...";

  button.disabled = true;


  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


    if(error)
      throw error;


    if(!data || !data.session){

      throw new Error(
        "로그인 세션을 만들지 못했습니다."
      );
    }


    status.textContent = "";

    showApp();

    await loadMembers();

  }
  catch(error){

    console.error(error);

    status.textContent =
      "로그인 실패: " +
      (error.message || "알 수 없는 오류");

    showLogin();

  }
  finally{

    button.disabled = false;

  }
}


/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  members = [];

  showLogin();
}


/* AUTH CHECK */

async function checkAuth(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();


    if(error)
      throw error;


    if(data && data.session){

      showApp();

      await loadMembers();

    }
    else{

      showLogin();

    }

  }
  catch(error){

    console.error(error);

    showLogin();

  }
}


/* AUTH STATE */

supabaseClient.auth.onAuthStateChange(
  (event) => {

    if(event === "SIGNED_OUT"){
      showLogin();
    }

  }
);


/* STATUS */

function setStatus(message,type=""){

  const element =
    document.getElementById("status");

  if(!element)
    return;

  element.textContent = message;

  element.className =
    "status " + type;
}


/* DRAFT */

function getDrafts(){

  try{

    const saved =
      localStorage.getItem(DRAFT_KEY);

    if(!saved)
      return {};

    return JSON.parse(saved);

  }
  catch(error){

    return {};

  }
}


function saveDrafts(drafts){

  try{

    localStorage.setItem(
      DRAFT_KEY,
      JSON.stringify(drafts)
    );

  }
  catch(error){

    console.error(error);

  }
}


function saveDraft(index){

  const member =
    members[index];

  if(!member)
    return;


  const getValue = field => {

    const element =
      document.getElementById(
        field+"-"+index
      );

    return element
      ? element.value
      : "";

  };


  const getCheck = field => {

    const element =
      document.getElementById(
        field+"-"+index
      );

    return element
      ? element.checked
      : false;

  };


  const drafts =
    getDrafts();


  drafts[String(member.id)] = {

    nickname:
      getValue("name"),

    초물:
      getValue("chomul"),

    스킬:
      getValue("skill"),

    스킬_lv:
      getValue("skill_lv"),

    알껍질:
      getValue("eggshell"),

    알껍질_lv:
      getValue("eggshell_lv"),

    알합치기:
      getValue("eggmerge"),

    탈것:
      getValue("mount"),

    탈것_lv:
      getValue("mount_lv"),

    탈것합치기:
      getValue("mountmerge"),

    승천대기자:
      getCheck("ascension"),

    스:
      getCheck("check_s"),

    펫:
      getCheck("check_pet"),

    탈:
      getCheck("check_tal")

  };


  saveDrafts(drafts);
}


function removeDraft(id){

  const drafts =
    getDrafts();

  delete drafts[String(id)];

  saveDrafts(drafts);
}


/* LOAD */

async function loadMembers(){

  setStatus(
    "데이터를 불러오는 중..."
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .select(`
      id,
      created_at,
      updated_at,
      nickname,
      초물,
      스킬,
      알껍질,
      알합치기,
      탈것,
      탈것합치기,
      승천대기자,
      스킬_lv,
      알껍질_lv,
      탈것_lv,
      스,
      펫,
      탈
    `)
    .order(
      "id",
      {ascending:true}
    );


  if(error){

    console.error(error);

    setStatus(
      "❌ 데이터를 불러오지 못했습니다: "+
      error.message,
      "error"
    );

    return;
  }


  const drafts =
    getDrafts();


  members =
    (data || []).map(row => {

      const draft =
        drafts[String(row.id)];


      return {

        id:
          row.id,

        created_at:
          row.created_at,

        updated_at:
          row.updated_at,

        name:
          draft?.nickname ??
          row.nickname ??
          "",

        chomul:
          draft?.초물 ??
          row.초물 ??
          "",

        skill:
          draft?.스킬 ??
          row.스킬 ??
          "",

        skill_lv:
          Number(
            draft?.스킬_lv ??
            row.스킬_lv ??
            0
          ),

        eggshell:
          draft?.알껍질 ??
          row.알껍질 ??
          "",

        eggshell_lv:
          Number(
            draft?.알껍질_lv ??
            row.알껍질_lv ??
            0
          ),

        eggmerge:
          draft?.알합치기 ??
          row.알합치기 ??
          0,

        mount:
          draft?.탈것 ??
          row.탈것 ??
          "",

        mount_lv:
          Number(
            draft?.탈것_lv ??
            row.탈것_lv ??
            0
          ),

        mountmerge:
          draft?.탈것합치기 ??
          row.탈것합치기 ??
          0,

        승천대기자:
          draft?.승천대기자 ??
          row.승천대기자 ??
          false,

        스:
          draft?.스 ??
          row.스 ??
          false,

        펫:
          draft?.펫 ??
          row.펫 ??
          false,

        탈:
          draft?.탈 ??
          row.탈 ??
          false

      };

    });


  render();

  setStatus(
    "✅ 데이터 불러오기 완료",
    "success"
  );
}


/* REALTIME */

supabaseClient
.channel("clan-members-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"clan_members"
  },
  () => {

    loadMembers();

  }
)
.subscribe();


/* EDIT CHECK */

function isEditing(index){

  const button =
    document.getElementById(
      "save-"+index
    );

  return button &&
    button.style.display !== "none";
}


/* RENDER */

function render(){

  const tbody =
    document.getElementById("members");

  if(!tbody)
    return;


  tbody.innerHTML = "";


  const searchElement =
    document.getElementById("search");

  const sortElement =
    document.getElementById("sort");


  const search =
    searchElement
      ? searchElement.value
          .trim()
          .toLowerCase()
      : "";


  const sort =
    sortElement
      ? sortElement.value
      : "default";


  let list =
    [...members];


  if(search){

    list =
      list.filter(
        member =>
          String(member.name)
            .toLowerCase()
            .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(b[sort]) -
        toNumber(a[sort])
    );

  }


  list.forEach(
    (member,index) => {

      const originalIndex =
        members.findIndex(
          x => x.id === member.id
        );


      const tr =
        document.createElement("tr");


      tr.innerHTML = `

<td>

<button
  class="edit-btn"
  id="edit-${originalIndex}"
  onclick="editMember(${originalIndex})"
>
수정
</button>

<button
  class="save-btn"
  id="save-${originalIndex}"
  onclick="saveMember(${originalIndex})"
>
저장
</button>

</td>


<!-- 승천대기 칸 하나 안에 스/펫/탈 -->

<td>

<div class="check-group">

<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="ascension-${originalIndex}"
  ${member.승천대기자 ? "checked" : ""}
  onchange="toggleCheck(${originalIndex},'승천대기자')"
>

<span>승천대기</span>

</label>


<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_s-${originalIndex}"
  ${member.스 ? "checked" : ""}
  onchange="toggleCheck(${originalIndex},'스')"
>

<span>스</span>

</label>


<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_pet-${originalIndex}"
  ${member.펫 ? "checked" : ""}
  onchange="toggleCheck(${originalIndex},'펫')"
>

<span>펫</span>

</label>


<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_tal-${originalIndex}"
  ${member.탈 ? "checked" : ""}
  onchange="toggleCheck(${originalIndex},'탈')"
>

<span>탈</span>

</label>

</div>

</td>


<td class="name-cell">

${
sort !== "default"
?
`<span class="rank">${index+1}위</span> `
:
""
}

<input
class="name-input"
id="name-${originalIndex}"
value="${escapeHtml(member.name)}"
disabled
>

</td>


<td>

<input
class="resource-input"
id="chomul-${originalIndex}"
value="${escapeHtml(member.chomul)}"
disabled
>

</td>


<td>

<div class="resource-box">

<span class="lv-label">LV</span>

<input
class="lv-input"
id="skill_lv-${originalIndex}"
type="number"
min="0"
step="1"
value="${member.skill_lv}"
disabled
>

<input
class="resource-input"

/* EDIT */

function editMember(index){

  enableFields(index);


  document.getElementById(
    "edit-"+index
  ).style.display = "none";


  document.getElementById(
    "save-"+index
  ).style.display = "inline-block";


  enableDraftAutoSave(index);

  saveDraft(index);


  setStatus(
    "✏️ 수정 중 · 입력값 자동저장"
  );
}


/* ENABLE */

function enableFields(index){

  const fields = [

    "name",
    "chomul",
    "skill_lv",
    "skill",
    "eggshell_lv",
    "eggshell",
    "eggmerge",
    "mount_lv",
    "mount",
    "mountmerge"

  ];


  fields.forEach(field => {

    const input =
      document.getElementById(
        field+"-"+index
      );

    if(input){
      input.disabled = false;
    }

  });
}


/* AUTOSAVE */

function enableDraftAutoSave(index){

  const fields = [

    "name",
    "chomul",
    "skill_lv",
    "skill",
    "eggshell_lv",
    "eggshell",
    "eggmerge",
    "mount_lv",
    "mount",
    "mountmerge"

  ];


  fields.forEach(field => {

    const element =
      document.getElementById(
        field+"-"+index
      );


    if(!element)
      return;


    element.oninput = () => {

      saveDraft(index);


      if(
        field === "skill" ||
        field === "eggshell" ||
        field === "mount"
      ){

        checkColor(
          element,
          field
        );

      }

    };

  });
}


/* SAVE */

async function saveMember(index){

  const member =
    members[index];


  const value = field => {

    const element =
      document.getElementById(
        field+"-"+index
      );

    return element
      ? element.value.trim()
      : "";

  };


  setStatus("💾 저장 중...");


  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .update({

      nickname:
        value("name"),

      초물:
        value("chomul"),

      스킬:
        value("skill"),

      스킬_lv:
        Number(value("skill_lv")) || 0,

      알껍질:
        value("eggshell"),

      알껍질_lv:
        Number(value("eggshell_lv")) || 0,

      알합치기:
        Number(value("eggmerge")) || 0,

      탈것:
        value("mount"),

      탈것_lv:
        Number(value("mount_lv")) || 0,

      탈것합치기:
        Number(value("mountmerge")) || 0,

      승천대기자:
        document.getElementById(
          "ascension-"+index
        ).checked,

      스:
        document.getElementById(
          "check_s-"+index
        ).checked,

      펫:
        document.getElementById(
          "check_pet-"+index
        ).checked,

      탈:
        document.getElementById(
          "check_tal-"+index
        ).checked,

      updated_at:
        new Date().toISOString()

    })
    .eq("id",member.id)
    .select()
    .single();


  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n"+
      error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;
  }


  removeDraft(member.id);


  members[index] = {

    ...member,

    id:data.id,

    updated_at:data.updated_at,

    name:data.nickname || "",

    chomul:data.초물 || "",

    skill:data.스킬 || "",

    skill_lv:data.스킬_lv ?? 0,

    eggshell:data.알껍질 || "",

    eggshell_lv:data.알껍질_lv ?? 0,

    eggmerge:data.알합치기 ?? 0,

    mount:data.탈것 || "",

    mount_lv:data.탈것_lv ?? 0,

    mountmerge:data.탈것합치기 ?? 0,

    승천대기자:
      data.승천대기자 ?? false,

    스:data.스 ?? false,

    펫:data.펫 ?? false,

    탈:data.탈 ?? false

  };


  render();


  setStatus(
    "✅ 저장 완료 · 실시간 반영됨",
    "success"
  );
}


/* CHECK */

async function toggleCheck(index,type){

  const member =
    members[index];


  const ids = {

    "승천대기자":
      "ascension-"+index,

    "스":
      "check_s-"+index,

    "펫":
      "check_pet-"+index,

    "탈":
      "check_tal-"+index

  };


  const checkbox =
    document.getElementById(
      ids[type]
    );


  if(!checkbox)
    return;


  const checked =
    checkbox.checked;


  saveDraft(index);


  const updateData = {};

  updateData[type] =
    checked;

  updateData.updated_at =
    new Date().toISOString();


  const {
    error
  } =
  await supabaseClient
    .from("clan_members")
    .update(updateData)
    .eq("id",member.id);


  if(error){

    console.error(error);

    checkbox.checked =
      !checked;

    alert(
      "체크 저장 실패\n\n"+
      error.message
    );

    return;
  }


  members[index][type] =
    checked;

  members[index].updated_at =
    updateData.updated_at;


  setStatus(
    checked
      ? "✅ "+type+" 체크 저장됨"
      : "☑ "+type+" 체크 해제됨",
    "success"
  );
}


/* COLOR */

function checkColor(input,type){

  if(!input)
    return;


  const value =
    toNumber(input.value);


  input.classList.remove("red");


  if(
    type === "skill" &&
    value >= 50000
  ){
    input.classList.add("red");
  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){
    input.classList.add("red");
  }


  if(
    type === "mount" &&
    value >= 30000
  ){
    input.classList.add("red");
  }
}


/* NUMBER */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return 0;
  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(/,/g,"");


  let number =
    parseFloat(text);


  if(isNaN(number))
    return 0;


  if(text.endsWith("m")){
    number *= 1000000;
  }
  else if(text.endsWith("k")){
    number *= 1000;
  }


  return number;
}


/* NUMBER DISPLAY */

function formatNumber(number){

  if(number === 0)
    return "0";


  if(number >= 1000000){

    return Number(
      (number/1000000).toFixed(2)
    )+"m";

  }


  if(number >= 1000){

    return Number(
      (number/1000).toFixed(2)
    )+"k";

  }


  return Math.round(number).toString();
}


/* UPDATED */

function formatUpdated(value){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(isNaN(date.getTime()))
    return "-";


  const diff =
    Date.now()-date.getTime();


  const minutes =
    Math.floor(diff/60000);


  if(minutes < 1){

    return `
      <span class="recent">
        방금 수정
      </span>
    `;

  }


  if(minutes < 60)
    return minutes+"분 전";


  const hours =
    Math.floor(minutes/60);


  if(hours < 24)
    return hours+"시간 전";


  const days =
    Math.floor(hours/24);


  if(days < 7)
    return days+"일 전";


  return (
    date.getMonth()+1
  )+
  "월 "+
  date.getDate()+
  "일";
}


/* TOTAL */

function updateTotals(){

  const fields = [

    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge"

  ];


  const totals = {};


  fields.forEach(
    field => {
      totals[field] = 0;
    }
  );


  members.forEach(member => {

    fields.forEach(field => {

      totals[field] +=
        toNumber(member[field]);

    });

  });


  document.getElementById(
    "total-chomul"
  ).textContent =
    formatNumber(totals.chomul);


  document.getElementById(
    "total-skill"
  ).textContent =
    formatNumber(totals.skill);


  document.getElementById(
    "total-eggshell"
  ).textContent =
    formatNumber(totals.eggshell);


  document.getElementById(
    "total-eggmerge"
  ).textContent =
    Math.round(totals.eggmerge)+"개";


  document.getElementById(
    "total-mount"
  ).textContent =
    formatNumber(totals.mount);


  document.getElementById(
    "total-mountmerge"
  ).textContent =
    Math.round(totals.mountmerge)+"개";
}


/* ESCAPE */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
