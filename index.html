<script>

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let members=[];
let currentRole=null;
let currentUser=null;

const DRAFT_KEY="elite_clan_draft_v2";


/* 로그인 화면 */

function showLogin(){
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("app").style.display="none";
}

function showApp(){
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
}


/* 로그인 */

async function login(){

  const email=document.getElementById("login-email").value.trim();
  const password=document.getElementById("login-password").value;
  const status=document.getElementById("login-status");
  const button=document.getElementById("login-button");

  if(!email || !password){
    status.textContent="이메일과 비밀번호를 입력해주세요.";
    return;
  }

  status.textContent="로그인 중...";
  button.disabled=true;

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  button.disabled=false;

  if(error){
    console.error(error);
    status.textContent="로그인 실패: "+error.message;
    showLogin();
    return;
  }

  if(!data.session){
    status.textContent="로그인 세션을 만들지 못했습니다.";
    showLogin();
    return;
  }

  currentUser=data.user;
  status.textContent="";

  showApp();

  await loadRole();
  await loadMembers();
}


/* 로그아웃 */

async function logout(){

  await supabaseClient.auth.signOut();

  members=[];
  currentUser=null;
  currentRole=null;

  document.getElementById("admin-button").style.display="none";

  showLogin();
}


/* 인증 확인 */

async function checkAuth(){

  const {data}=await supabaseClient.auth.getSession();

  if(data && data.session){

    currentUser=data.session.user;

    showApp();

    await loadRole();
    await loadMembers();

  }else{
    showLogin();
  }
}


supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(event==="SIGNED_OUT"){
      showLogin();
    }

    if(
      event==="SIGNED_IN" &&
      session
    ){
      currentUser=session.user;
    }

  }
);


/* 역할 불러오기 */

async function loadRole(){

  if(!currentUser){
    currentRole=null;
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("clan_roles")
      .select("role")
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    currentRole=null;
    document.getElementById("admin-button").style.display="none";
    return;
  }

  currentRole=data?.role || null;

  const button=
    document.getElementById("admin-button");

  if(
    currentRole==="admin" ||
    currentRole==="superadmin"
  ){
    button.style.display="inline-block";
    button.textContent=
      currentRole==="superadmin"
      ? "최고관리자"
      : "관리자";
  }else{
    button.style.display="none";
  }
}


/* 상태 */

function setStatus(message,type=""){

  const element=document.getElementById("status");

  if(!element)return;

  element.textContent=message;
  element.className="status "+type;
}


/* 초안 */

function getDrafts(){

  try{
    const saved=localStorage.getItem(DRAFT_KEY);
    return saved ? JSON.parse(saved) : {};
  }catch(e){
    return {};
  }
}

function saveDrafts(drafts){

  try{
    localStorage.setItem(
      DRAFT_KEY,
      JSON.stringify(drafts)
    );
  }catch(e){
    console.error(e);
  }
}

function saveDraft(index){

  const member=members[index];

  if(!member)return;

  const getValue=field=>{
    const el=document.getElementById(field+"-"+index);
    return el ? el.value : "";
  };

  const getCheck=field=>{
    const el=document.getElementById(field+"-"+index);
    return el ? el.checked : false;
  };

  const drafts=getDrafts();

  drafts[String(member.id)]={

    nickname:getValue("name"),
    초물:getValue("chomul"),
    스킬:getValue("skill"),
    스킬_lv:getValue("skill_lv"),
    알껍질:getValue("eggshell"),
    알껍질_lv:getValue("eggshell_lv"),
    알합치기:getValue("eggmerge"),
    탈것:getValue("mount"),
    탈것_lv:getValue("mount_lv"),
    탈것합치기:getValue("mountmerge"),

    스:getCheck("check_s"),
    펫:getCheck("check_pet"),
    탈:getCheck("check_tal")
  };

  saveDrafts(drafts);
}

function removeDraft(id){

  const drafts=getDrafts();

  delete drafts[String(id)];

  saveDrafts(drafts);
}


/* 회원 불러오기 */

async function loadMembers(){

  setStatus("데이터를 불러오는 중...");

  const {data,error} =
    await supabaseClient
      .from("clan_members")
      .select(`
        id,
        created_at,
        updated_at,
        nickname,
        초물,
        스킬,
        알껍질,
        알합치기,
        탈것,
        탈것합치기,
        스킬_lv,
        알껍질_lv,
        탈것_lv,
        스,
        펫,
        탈
      `)
      .order("id",{ascending:true});

  if(error){

    console.error(error);

    setStatus(
      "❌ 데이터를 불러오지 못했습니다: "+error.message,
      "error"
    );

    return;
  }

  const drafts=getDrafts();

  members=(data||[]).map(row=>{

    const draft=drafts[String(row.id)];

    return {

      id:row.id,
      created_at:row.created_at,
      updated_at:row.updated_at,

      name:draft?.nickname ?? row.nickname ?? "",
      chomul:draft?.초물 ?? row.초물 ?? "",
      skill:draft?.스킬 ?? row.스킬 ?? "",

      skill_lv:Number(
        draft?.스킬_lv ??
        row.스킬_lv ??
        0
      ),

      eggshell:draft?.알껍질 ?? row.알껍질 ?? "",

      eggshell_lv:Number(
        draft?.알껍질_lv ??
        row.알껍질_lv ??
        0
      ),

      eggmerge:draft?.알합치기 ??
        row.알합치기 ?? 0,

      mount:draft?.탈것 ??
        row.탈것 ?? "",

      mount_lv:Number(
        draft?.탈것_lv ??
        row.탈것_lv ??
        0
      ),

      mountmerge:draft?.탈것합치기 ??
        row.탈것합치기 ?? 0,

      스:draft?.스 ??
        row.스 ?? false,

      펫:draft?.펫 ??
        row.펫 ?? false,

      탈:draft?.탈 ??
        row.탈 ?? false
    };

  });

  render();

  setStatus(
    "✅ 데이터 불러오기 완료",
    "success"
  );
}


/* 실시간 */

supabaseClient
.channel("clan-members-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"clan_members"
  },
  ()=>{
    loadMembers();
  }
)
.subscribe();


/* 렌더 */

function render(){

  const tbody=document.getElementById("members");

  if(!tbody)return;

  tbody.innerHTML="";

  const search=
    document.getElementById("search")
      ?.value.trim().toLowerCase() || "";

  const sort=
    document.getElementById("sort")
      ?.value || "default";

  let list=[...members];

  if(search){

    list=list.filter(member=>
      String(member.name)
        .toLowerCase()
        .includes(search)
    );

  }

  if(sort!=="default"){

    list.sort(
      (a,b)=>
        toNumber(b[sort])-
        toNumber(a[sort])
    );

  }

  list.forEach((member,index)=>{

    const originalIndex=
      members.findIndex(
        x=>x.id===member.id
      );

    const tr=document.createElement("tr");

    tr.innerHTML=`

<td>

<button
 class="edit-btn"
 id="edit-${originalIndex}"
 onclick="editMember(${originalIndex})"
>
수정
</button>

<button
 class="save-btn"
 id="save-${originalIndex}"
 onclick="saveMember(${originalIndex})"
>
저장
</button>

</td>


<td>

<div class="check-group">

<label class="check-item">

<input
 type="checkbox"
 class="checkbox"
 id="check_s-${originalIndex}"
 ${member.스?"checked":""}
 onchange="toggleCheck(${originalIndex},'스')"
>

<span>스</span>

</label>


<label class="check-item">

<input
 type="checkbox"
 class="checkbox"
 id="check_pet-${originalIndex}"
 ${member.펫?"checked":""}
 onchange="toggleCheck(${originalIndex},'펫')"
>

<span>펫</span>

</label>


<label class="check-item">

<input
 type="checkbox"
 class="checkbox"
 id="check_tal-${originalIndex}"
 ${member.탈?"checked":""}
 onchange="toggleCheck(${originalIndex},'탈')"
>

<span>탈</span>

</label>

</div>

</td>


<td class="name-cell">

${
sort!=="default"
?`<span class="rank">${index+1}위</span> `
:""
}

<input
 class="name-input"
 id="name-${originalIndex}"
 value="${escapeHtml(member.name)}"
 disabled
>

</td>


<td>

<input
 class="resource-input"
 id="chomul-${originalIndex}"
 value="${escapeHtml(member.chomul)}"
 disabled

/* 수정 */

function editMember(index){

  enableFields(index);

  document.getElementById(
    "edit-"+index
  ).style.display="none";

  document.getElementById(
    "save-"+index
  ).style.display="inline-block";

  enableDraftAutoSave(index);

  saveDraft(index);

  setStatus(
    "✏️ 수정 중 · 입력값 자동저장"
  );
}


function enableFields(index){

  [
    "name",
    "chomul",
    "skill_lv",
    "skill",
    "eggshell_lv",
    "eggshell",
    "eggmerge",
    "mount_lv",
    "mount",
    "mountmerge"
  ].forEach(field=>{

    const input=
      document.getElementById(
        field+"-"+index
      );

    if(input)
      input.disabled=false;

  });
}


function enableDraftAutoSave(index){

  [
    "name",
    "chomul",
    "skill_lv",
    "skill",
    "eggshell_lv",
    "eggshell",
    "eggmerge",
    "mount_lv",
    "mount",
    "mountmerge"
  ].forEach(field=>{

    const element=
      document.getElementById(
        field+"-"+index
      );

    if(!element)return;

    element.oninput=()=>{

      saveDraft(index);

      if(
        field==="skill" ||
        field==="eggshell" ||
        field==="mount"
      ){
        checkColor(element,field);
      }

    };

  });
}


/* 저장 */

async function saveMember(index){

  const member=members[index];

  const value=field=>{

    const element=
      document.getElementById(
        field+"-"+index
      );

    return element
      ? element.value.trim()
      : "";

  };

  setStatus("💾 저장 중...");

  const {data,error}=
    await supabaseClient
      .from("clan_members")
      .update({

        nickname:value("name"),
        초물:value("chomul"),
        스킬:value("skill"),

        스킬_lv:
          Number(value("skill_lv"))||0,

        알껍질:value("eggshell"),

        알껍질_lv:
          Number(value("eggshell_lv"))||0,

        알합치기:
          Number(value("eggmerge"))||0,

        탈것:value("mount"),

        탈것_lv:
          Number(value("mount_lv"))||0,

        탈것합치기:
          Number(value("mountmerge"))||0,

        스:
          document.getElementById(
            "check_s-"+index
          ).checked,

        펫:
          document.getElementById(
            "check_pet-"+index
          ).checked,

        탈:
          document.getElementById(
            "check_tal-"+index
          ).checked,

        updated_at:
          new Date().toISOString()

      })
      .eq("id",member.id)
      .select()
      .single();

  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n"+error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;
  }

  removeDraft(member.id);

  members[index]={

    ...member,

    updated_at:data.updated_at,

    name:data.nickname||"",
    chomul:data.초물||"",
    skill:data.스킬||"",
    skill_lv:data.스킬_lv??0,

    eggshell:data.알껍질||"",
    eggshell_lv:data.알껍질_lv??0,

    eggmerge:data.알합치기??0,

    mount:data.탈것||"",
    mount_lv:data.탈것_lv??0,

    mountmerge:data.탈것합치기??0,

    스:data.스??false,
    펫:data.펫??false,
    탈:data.탈??false
  };

  render();

  setStatus(
    "✅ 저장 완료 · 실시간 반영됨",
    "success"
  );
}


/* 체크 */

async function toggleCheck(index,type){

  const member=members[index];

  const ids={
    "스":"check_s-"+index,
    "펫":"check_pet-"+index,
    "탈":"check_tal-"+index
  };

  const checkbox=
    document.getElementById(ids[type]);

  const checked=checkbox.checked;

  const updateData={};

  updateData[type]=checked;
  updateData.updated_at=
    new Date().toISOString();

  const {error}=
    await supabaseClient
      .from("clan_members")
      .update(updateData)
      .eq("id",member.id);

  if(error){

    console.error(error);

    checkbox.checked=!checked;

    alert(
      "체크 저장 실패\n\n"+
      error.message
    );

    return;
  }

  members[index][type]=checked;
  members[index].updated_at=
    updateData.updated_at;

  saveDraft(index);

  setStatus(
    checked
    ? "✅ "+type+" 체크 저장됨"
    : "☑ "+type+" 체크 해제됨",
    "success"
  );
}


/* 색상 */

function checkColor(input,type){

  if(!input)return;

  const value=toNumber(input.value);

  input.classList.remove("red");

  if(
    type==="skill" &&
    value>=50000
  ){
    input.classList.add("red");
  }

  if(
    type==="eggshell" &&
    value>=50000
  ){
    input.classList.add("red");
  }

  if(
    type==="mount" &&
    value>=30000
  ){
    input.classList.add("red");
  }
}


/* 숫자 */

function toNumber(value){

  if(
    value===null ||
    value===undefined ||
    value===""
  ){
    return 0;
  }

  const text=
    String(value)
      .trim()
      .toLowerCase()
      .replace(/,/g,"");

  let number=parseFloat(text);

  if(isNaN(number))
    return 0;

  if(text.endsWith("m"))
    number*=1000000;
  else if(text.endsWith("k"))
    number*=1000;

  return number;
}


function formatNumber(number){

  if(number===0)return "0";

  if(number>=1000000){

    return Number(
      (number/1000000).toFixed(2)
    )+"m";

  }

  if(number>=1000){

    return Number(
      (number/1000).toFixed(2)
    )+"k";

  }

  return Math.round(number).toString();
}


/* 수정 시간 */

function formatUpdated(value){

  if(!value)return "-";

  const date=new Date(value);

  if(isNaN(date.getTime()))
    return "-";

  const diff=
    Date.now()-date.getTime();

  const minutes=
    Math.floor(diff/60000);

  if(minutes<1){

    return `<span class="recent">방금 수정</span>`;

  }

  if(minutes<60)
    return minutes+"분 전";

  const hours=
    Math.floor(minutes/60);

  if(hours<24)
    return hours+"시간 전";

  const days=
    Math.floor(hours/24);

  if(days<7)
    return days+"일 전";

  return (
    date.getMonth()+1
  )+"월 "+
  date.getDate()+
  "일";
}


/* 합계 */

function updateTotals(){

  const totals={
    chomul:0,
    skill:0,
    eggshell:0,
    eggmerge:0,
    mount:0,
    mountmerge:0
  };

  members.forEach(member=>{

    Object.keys(totals).forEach(field=>{

      totals[field]+=toNumber(
        member[field]
      );

    });

  });

  document.getElementById(
    "total-chomul"
  ).textContent=
    formatNumber(totals.chomul);

  document.getElementById(
    "total-skill"
  ).textContent=
    formatNumber(totals.skill);

  document.getElementById(
    "total-eggshell"
  ).textContent=
    formatNumber(totals.eggshell);

  document.getElementById(
    "total-eggmerge"
  ).textContent=
    Math.round(totals.eggmerge)+"개";

  document.getElementById(
    "total-mount"
  ).textContent=
    formatNumber(totals.mount);

  document.getElementById(
    "total-mountmerge"
  ).textContent=
    Math.round(totals.mountmerge)+"개";
}


/* HTML 이스케이프 */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

async function openAdminPanel(){

/*
  관리자 목록은 로그인 가능한 사용자와
  clan_members의 닉네임을 연결해서 표시한다.
*/

async function loadAdminUsers(){

  const box=
    document.getElementById(
      "admin-users"
    );

  box.innerHTML=
    "<div style='padding:10px;color:#94a3b8'>불러오는 중...</div>";

  const {data:roles,error}=
    await supabaseClient
      .from("clan_roles")
      .select("user_id,role");

  if(error){

    box.innerHTML=
      `<div style="color:#f87171;padding:10px">
        역할 정보를 불러오지 못했습니다.<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  /*
    현재 페이지에서는 Supabase Auth의 다른 사용자
    이메일을 클라이언트에서 직접 조회할 수 없으므로
    clan_roles에 등록된 UID와 현재 회원 데이터를 기준으로
    관리한다.
  */

  const roleMap={};

  (roles||[]).forEach(row=>{
    roleMap[row.user_id]=row.role;
  });

  const rows=[];

  (roles||[]).forEach(row=>{

    const member=
      members.find(
        m=>String(m.user_id)===String(row.user_id)
      );

    rows.push({
      user_id:row.user_id,
      name:
        member?.name ||
        row.user_id
    });

  });

  /*
    현재 로그인 사용자는 항상 표시
  */

  if(
    currentUser &&
    !rows.some(
      x=>x.user_id===currentUser.id
    )
  ){

    rows.push({
      user_id:currentUser.id,
      name:
        currentUser.email ||
        currentUser.id
    });

  }

  if(!rows.length){

    box.innerHTML=
      "<div style='padding:10px;color:#94a3b8'>관리자 목록이 없습니다.</div>";

    return;
  }

  box.innerHTML="";

  rows.forEach(row=>{

    const role=
      roleMap[row.user_id] || "";

    const div=
      document.createElement("div");

    div.className="admin-user";

    let controls="";

    if(currentRole==="superadmin"){

      controls=`

<select
 class="role-select"
 onchange="changeRole('${row.user_id}',this.value)"
>

<option value=""
 ${role===""?"selected":""}>
일반
</option>

<option value="admin"
 ${role==="admin"?"selected":""}>
관리자
</option>

<option value="superadmin"
 ${role==="superadmin"?"selected":""}>
최고관리자
</option>

</select>
`;

    }else{

      controls=
        `<span style="color:#94a3b8;font-size:11px">
          ${role==="superadmin"
            ?"최고관리자"
            :role==="admin"
            ?"관리자"
            :"일반"}
        </span>`;

    }

    div.innerHTML=`

<div class="admin-user-name">

<b>${escapeHtml(row.name)}</b>

<br>

<span
 style="
 color:#64748b;
 font-size:9px;
 "
>
${escapeHtml(row.user_id)}
</span>

</div>

${controls}

`;

    box.appendChild(div);

  });
}


/* 역할 변경 */

async function changeRole(userId,role){

  if(currentRole!=="superadmin"){

    alert(
      "최고관리자만 권한을 변경할 수 있습니다."
    );

    await loadAdminUsers();

    return;
  }

  /*
    최고관리자는 본인을 실수로 제거하지 못하게 함
  */

  if(
    userId===currentUser.id &&
    role!=="superadmin"
  ){

    alert(
      "현재 최고관리자 본인의 권한은 여기서 내릴 수 없습니다."
    );

    await loadAdminUsers();

    return;
  }


  /*
    최고관리자는 최대 2명까지.
    최초 최고관리자 + 추가 1명.
  */

  if(role==="superadmin"){

    const {count,error}=
      await supabaseClient
        .from("clan_roles")
        .select("*",{count:"exact",head:true})
        .eq("role","superadmin");

    if(error){

      alert(
        "역할 확인 실패\n\n"+
        error.message
      );

      await loadAdminUsers();

      return;
    }

    if(
      (count||0)>=2
    ){

      const {data:existing}=
        await supabaseClient
          .from("clan_roles")
          .select("user_id")
          .eq("role","superadmin")
          .neq("user_id",userId)
          .limit(2);

      if(
        existing &&
        existing.length>=2
      ){

        alert(
          "최고관리자는 최대 2명까지 지정할 수 있습니다."
        );

        await loadAdminUsers();

        return;
      }
    }
  }


  if(!role){

    const {error}=
      await supabaseClient
        .from("clan_roles")
        .delete()
        .eq("user_id",userId);

    if(error){

      alert(
        "권한 제거 실패\n\n"+
        error.message
      );

      await loadAdminUsers();

      return;
    }

  }else{

    const {error}=
      await supabaseClient
        .from("clan_roles")
        .upsert(
          {
            user_id:userId,
            role:role
          },
          {
            onConflict:"user_id"
          }
        );

    if(error){

      alert(
        "권한 변경 실패\n\n"+
        error.message
      );

      await loadAdminUsers();

      return;
    }

  }

  await loadAdminUsers();

  await loadRole();

  alert(
    role
    ? "✅ 권한이 변경되었습니다."
    : "✅ 관리자 권한이 제거되었습니다."
  );
}
