<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#080d18;

/* =========================================================
   LOGIN
========================================================= */

#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:360px;
  background:#111a2b;
  border:1px solid #263550;
  border-radius:16px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.login-logo{
  font-size:42px;
}

.login-box h2{
  margin:8px 0 4px;
}

.login-box p{
  color:#94a3b8;
  font-size:12px;
  margin:0 0 20px;
}

.login-box input{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  font-size:14px;
  text-align:left;
  border:1px solid #334155;
  border-radius:8px;
  background:#080d18;
  color:white;
}

.login-box button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.login-box button:disabled{
  opacity:.6;
}

#login-status{
  min-height:18px;
  margin-top:12px;
  font-size:12px;
  color:#f87171;
}


/* =========================================================
   APP
========================================================= */

#app{
  display:none;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:10px;
}

.header{
  position:relative;
  text-align:center;
  padding:10px 0 14px;
}

.logo{
  font-size:34px;
}

h1{
  margin:2px 0;
  font-size:23px;
}

.subtitle{
  margin:3px 0;
  color:#94a3b8;
  font-size:12px;
}

.header-buttons{
  position:absolute;
  right:0;
  top:10px;
  display:flex;
  gap:6px;
  align-items:center;
}

.logout-btn,
.admin-btn{
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;

}

.logout-btn{
  border:1px solid #334155;

}

.admin-btn{

/* =========================================================
   NOTICE
========================================================= */

.notice{
  background:#111a2b;
  border:1px solid #263550;
  border-radius:12px;
  padding:10px;

}

.notice b{

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;

  margin-bottom:8px;
}

.search{
  flex:1;
  min-width:0;
  padding:10px;

.sort{

/* =========================================================
   STATUS
========================================================= */

.status{

}

.success{

}

}


/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  overflow-x:auto;
  background:#111a2b;
  border:1px solid #263550;
  border-radius:12px;
  -webkit-overflow-scrolling:touch;
}

table{

/* =========================================================
   ASCENSION
========================================================= */

.ascension-cell{
  min-width:90px;
}

.ascension-title{
  color:#fbbf24;
  font-size:11px;
  font-weight:900;
  margin-bottom:5px;
}

.check-group{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;

}

.check-item{

  height:18px;
  margin:0;

  cursor:pointer;
}


/* =========================================================
   INPUT
========================================================= */

input{

  padding:7px 4px;
  border:1px solid #334155;

.name-input{

}


/* =========================================================
   RESOURCE
========================================================= */

.resource-box{

}

.lv-label{

/* =========================================================
   ADMIN PANEL
========================================================= */

#admin-panel{

  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.72);

}

.admin-box{
  width:100%;
  max-width:800px;

}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.admin-header h2{
  margin:0;

}

.admin-close{
  border:0;
  background:#334155;
  color:white;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
}

.admin-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.admin-user{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px;
  border:1px solid #263550;
  border-radius:9px;
  background:#0c1423;
}

.admin-email{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.admin-role{
  display:flex;
  align-items:center;
  gap:7px;
}

.admin-save{
  border:0;
  border-radius:6px;
  background:#16a34a;
  color:white;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}


/* =========================================================
   TOTAL
========================================================= */

.total{
  background:#1d293d;
  font-weight:bold;
}

.total td{
  border-top:2px solid #3b4d6b;
  font-size:11px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .container{
    padding:7px;
  }

  .logo{
    font-size:30px;
  }

  h1{
    font-size:20px;
  }

  .header-buttons{
    position:static;
    justify-content:center;
    margin-top:8px;
  }

  .toolbar{
    flex-direction:column;
  }

  .search,
  .sort{
    width:100%;
  }

  th{
    padding:9px 5px;
  }

  td{
    padding:5px 4px;
  }

  input{
    padding:8px 3px;
  }

  .resource-box{
    gap:2px;
  }

  .lv-input{
    width:38px;
    min-width:38px;
  }

  .resource-input{
    width:62px;
    min-width:62px;
  }

  .edit-btn,
  .save-btn{
    padding:9px;
  }

  .admin-user{
    align-items:flex-start;
    flex-direction:column;
  }

  .admin-role{
    width:100%;
  }

  .role-select{
    flex:1;
  }

}

</style>

</head>

<body>

     LOGIN
========================================================= -->

<div id="login-screen">

</div>

</div>


<!-- =========================================================
     ADMIN PANEL
========================================================= -->

<div id="admin-panel">

  <div class="admin-box">

    <div class="admin-header">

      <h2>
        👑 관리자 권한 관리
      </h2>

      <button
        class="admin-close"
        onclick="closeAdminPanel()"
      >
        닫기
      </button>

    </div>

    <div
      id="admin-status"
      class="status"
    ></div>

    <div
      id="admin-list"
      class="admin-list"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   최고관리자 이메일
========================================================= */

const SUPER_ADMIN_EMAILS = [
  "rlacjdrb123@naver.com"
];


/* =========================================================
   DATA
========================================================= */

let members = [];

let currentUser = null;

let currentRole = "회원";

const DRAFT_KEY =
"elite_clan_draft_v3";


/* =========================================================
   LOGIN UI
========================================================= */

function showLogin(){

  document.getElementById(
    "login-screen"
  ).style.display = "flex";

  document.getElementById(
    "app"
  ).style.display = "none";

}


function showApp(){

  document.getElementById(
    "login-screen"
  ).style.display = "none";

  document.getElementById(
    "app"
  ).style.display = "block";

}


/* =========================================================
   ROLE
========================================================= */

async function loadCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if(
    error ||
    !data ||
    !data.user
  ){

    currentUser = null;
    currentRole = "회원";

    renderAdminButton();

    return;

  }


  currentUser =
    data.user;


  const email =
    (
      data.user.email ||
      ""
    ).toLowerCase();


  if(
    SUPER_ADMIN_EMAILS.includes(email)
  ){

    currentRole =
      "최고관리자";

  }
  else{

    const {
      data: roleData,
      error: roleError
    } =
    await supabaseClient
      .rpc("get_my_role");


    if(roleError){

      console.error(
        roleError
      );

      currentRole =
        "회원";

    }
    else{

      currentRole =
        roleData ||
        "회원";

    }

  }


  renderAdminButton();

}


function renderAdminButton(){

  const area =
    document.getElementById(
      "admin-area"
    );

  if(!area)
    return;


  area.innerHTML = "";


  if(
    currentRole !== "관리자" &&
    currentRole !== "최고관리자"
  ){

    return;

  }


  const button =
    document.createElement(
      "button"
    );


  button.className =
    "admin-btn";


  button.textContent =
    currentRole === "최고관리자"
      ? "최고관리자"
      : "관리자";


  button.onclick =
    openAdminPanel;


  area.appendChild(
    button
  );

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document.getElementById(
      "login-email"
    ).value.trim();

  const password =
    document.getElementById(
      "login-password"
    ).value;

  const status =
    document.getElementById(
      "login-status"
    );

  const button =
    document.getElementById(
      "login-button"
    );


  if(
    !email ||
    !password
  ){

    status.textContent =
      "이메일과 비밀번호를 입력해주세요.";

    return;

  }


  status.textContent =
    "로그인 중...";

  button.disabled =
    true;


  const {
    data,
    error
  } =
  await supabaseClient.auth
    .signInWithPassword({

      email,
      password

    });


  button.disabled =
    false;


  if(error){

    console.error(error);

    status.textContent =
      "로그인 실패: " +
      error.message;

    showLogin();

    return;

  }


  if(
    !data ||
    !data.session
  ){

    status.textContent =
      "로그인 세션을 만들지 못했습니다.";

    showLogin();

    return;

  }


  status.textContent =
    "";

  showApp();

  await loadCurrentUser();

  await loadMembers();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  members = [];

  currentUser = null;

  currentRole = "회원";

  showLogin();

}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuth(){

  const {
    data
  } =
  await supabaseClient.auth.getSession();


  if(
    data &&
    data.session
  ){

    showApp();

    await loadCurrentUser();

    await loadMembers();

  }
  else{

    showLogin();

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(
      event === "SIGNED_OUT"
    ){

      currentUser = null;
      currentRole = "회원";

      showLogin();

    }

  }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type=""
){

  const element =
    document.getElementById(
      "status"
    );

  if(!element)
    return;

  element.textContent =
    message;

  element.className =
    "status " + type;

}


/* =========================================================
   DRAFT
========================================================= */

function getDrafts(){

  try{

    const saved =
      localStorage.getItem(
        DRAFT_KEY
      );

    if(!saved)
      return {};

    return JSON.parse(
      saved
    );

  }
  catch(error){

    return {};

  }

}


function saveDrafts(
  drafts
){

  try{

    localStorage.setItem(
      DRAFT_KEY,
      JSON.stringify(drafts)
    );

  }
  catch(error){

    console.error(
      error
    );

  }

}


function saveDraft(index){

  const member =
    members[index];

  if(!member)
    return;


  const getValue =
    field => {

      const element =
        document.getElementById(
          field +
          "-" +
          index
        );

      return element
        ? element.value
        : "";

    };


  const getCheck =
    field => {

      const element =
        document.getElementById(
          field +
          "-" +
          index
        );

      return element
        ? element.checked
        : false;

    };


  const drafts =
    getDrafts();


  drafts[String(member.id)] = {

    nickname:
      getValue("name"),

    초물:
      getValue("chomul"),

    스킬:
      getValue("skill"),

    스킬_lv:
      getValue("skill_lv"),

    알껍질:
      getValue("eggshell"),

    알껍질_lv:
      getValue("eggshell_lv"),

    알합치기:
      getValue("eggmerge"),

    탈것:
      getValue("mount"),

    탈것_lv:
      getValue("mount_lv"),

    탈것합치기:
      getValue("mountmerge"),

    스:
      getCheck("check_s"),

    펫:
      getCheck("check_pet"),

    탈:

}

/* =========================================================
   COLOR
========================================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}


/* =========================================================
   NUMBER
========================================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(
      text
    );


  if(
    isNaN(number)
  )
    return 0;


  if(
    text.endsWith("m")
  ){

    number *=
      1000000;

  }
  else if(
    text.endsWith("k")
  ){

    number *=
      1000;

  }


  return number;

}


/* =========================================================
   NUMBER DISPLAY
========================================================= */

function formatNumber(
  number
){

  if(
    number === 0
  )
    return "0";


  if(
    number >= 1000000
  ){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    ) + "m";

  }


  if(
    number >= 1000
  ){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    ) + "k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================================
   LAST UPDATED
========================================================= */

function formatUpdated(
  value
){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff / 60000
    );


  if(
    minutes < 1
  ){

    return `
      <span class="recent">
        방금 수정
      </span>
    `;

  }


  if(
    minutes < 60
  ){

    return (
      minutes +
      "분 전"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(
    hours < 24
  ){

    return (
      hours +
      "시간 전"
    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(
    days < 7
  ){

    return (
      days +
      "일 전"
    );

  }


  return (
    date.getMonth() +
    1
  ) +
  "월 " +
  date.getDate() +
  "일";

}


/* =========================================================
   TOTAL
========================================================= */

function updateTotals(){

  const fields = [

    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge"

  ];


  const totals = {};


  fields.forEach(
    field => {

      totals[field] =
        0;

    }
  );


  members.forEach(
    member => {

      fields.forEach(
        field => {

          totals[field] +=
            toNumber(
              member[field]
            );

        }
      );

    }
  );


  document.getElementById(
    "total-chomul"

    formatNumber(
      totals.chomul
    );


  document.getElementById(
    "total-skill"
  ).textContent =
    formatNumber(
      totals.skill
    );


  document.getElementById(
    "total-eggshell"
  ).textContent =
    formatNumber(
      totals.eggshell
    );


  document.getElementById(
    "total-eggmerge"

    "최고관리자"
  ){

    alert(
      "최고관리자만 권한을 변경할 수 있습니다."
    );

    return;

  }


  const select =
    document.getElementById(
      "role-" +
      userId
    );


  if(!select)
    return;


  const newRole =
    select.value;


  if(
    !confirm(
      "이 사용자의 권한을\n\n" +
      newRole +
      "\n\n로 변경할까요?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .rpc(
      "set_user_role",
      {
        target_user_id:
          userId,

        new_role:
          newRole
      }
    );


  if(error){

    console.error(error);

    alert(
      "권한 변경 실패\n\n" +
      error.message
    );

    return;

  }


  alert(
    "✅ 권한이 변경되었습니다."
  );


  await loadAdminUsers();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}
