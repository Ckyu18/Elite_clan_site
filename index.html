<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   자동 임시저장 KEY
========================================= */

const DRAFT_KEY =
"elite_clan_draft_v1";


/* =========================================
   DATA
========================================= */

let members = [];


/* =========================================
   STATUS
========================================= */

function setStatus(message,type=""){

  const element =
    document.getElementById("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}


/* =========================================
   임시저장 불러오기
========================================= */

function getDrafts(){

  try{

    const saved =
      localStorage.getItem(
        DRAFT_KEY
      );

    if(!saved)
      return {};

    return JSON.parse(saved);

  }
  catch(error){

    console.error(
      "임시저장 불러오기 실패",
      error
    );

    return {};

  }

}


/* =========================================
   임시저장 전체 저장
========================================= */

function saveDrafts(drafts){

  try{

    localStorage.setItem(
      DRAFT_KEY,
      JSON.stringify(drafts)
    );

  }
  catch(error){

    console.error(
      "임시저장 실패",
      error
    );

  }

}


/* =========================================
   특정 회원 임시저장
========================================= */

function saveDraft(index){

  const member =
    members[index];

  if(!member)
    return;


  const getValue =
    field => {

      const element =
        document.getElementById(
          field+"-"+index
        );

      return element
        ? element.value
        : "";

    };


  const checkbox =
    document.getElementById(
      "ascension-"+index
    );


  const drafts =
    getDrafts();


  drafts[String(member.id)] = {

    nickname:
      getValue("name"),

    초물:
      getValue("chomul"),

    스킬:
      getValue("skill"),

    스킬_lv:
      getValue("skill_lv"),

    알껍질:
      getValue("eggshell"),

    알껍질_lv:
      getValue("eggshell_lv"),

    알합치기:
      getValue("eggmerge"),

    탈것:
      getValue("mount"),

    탈것_lv:
      getValue("mount_lv"),

    탈것합치기:
      getValue("mountmerge"),

    승천대기자:
      checkbox
      ? checkbox.checked
      : member.ascension

  };


  saveDrafts(drafts);

}


/* =========================================
   임시저장 삭제
========================================= */

function removeDraft(id){

  const drafts =
    getDrafts();


  delete drafts[String(id)];


  saveDrafts(drafts);

}


/* =========================================
   LOAD
========================================= */

async function loadMembers(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .select(`
      id,
      created_at,
      updated_at,
      nickname,
      초물,
      스킬,
      알껍질,
      알합치기,
      탈것,
      탈것합치기,
      승천대기자,
      스킬_lv,
      알껍질_lv,
      탈것_lv
    `)
    .order(
      "id",
      {ascending:true}
    );


  if(error){

    console.error(error);

    setStatus(
      "❌ 데이터를 불러오지 못했습니다.",
      "error"
    );

    return;
  }


  const drafts =
    getDrafts();


  members =
    (data || []).map(row => {

      const draft =
        drafts[String(row.id)];


      if(draft){

        return {

          id:
            row.id,

          created_at:
            row.created_at,

          updated_at:
            row.updated_at,

          name:
            draft.nickname ??
            row.nickname ??
            "",

          ascension:
            draft.승천대기자 ??
            row.승천대기자 ??
            false,

          chomul:
            draft.초물 ??
            row.초물 ??
            "",

          skill:
            draft.스킬 ??
            row.스킬 ??
            "",

          skill_lv:
            Number(
              draft.스킬_lv
            ) || 0,

          eggshell:
            draft.알껍질 ??
            row.알껍질 ??
            "",

          eggshell_lv:
            Number(
              draft.알껍질_lv
            ) || 0,

          eggmerge:
            draft.알합치기 ??
            row.알합치기 ??
            0,

          mount:
            draft.탈것 ??
            row.탈것 ??
            "",

          mount_lv:
            Number(
              draft.탈것_lv
            ) || 0,

          mountmerge:
            draft.탈것합치기 ??
            row.탈것합치기 ??
            0

        };

      }


      return {

        id:
          row.id,

        created_at:
          row.created_at,

        updated_at:
          row.updated_at,

        name:
          row.nickname || "",

        ascension:
          row.승천대기자 || false,

        chomul:
          row.초물 || "",

        skill:
          row.스킬 || "",

        skill_lv:
          row.스킬_lv ?? 0,

        eggshell:
          row.알껍질 || "",

        eggshell_lv:
          row.알껍질_lv ?? 0,

        eggmerge:
          row.알합치기 ?? 0,

        mount:
          row.탈것 || "",

        mount_lv:
          row.탈것_lv ?? 0,

        mountmerge:
          row.탈것합치기 ?? 0

      };

    });


  render();

}


/* =========================================
   REALTIME
========================================= */

supabaseClient
.channel("clan-members-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"clan_members"
  },
  payload => {

    /*
      내가 저장한 데이터가
      실시간으로 다시 들어올 때
      현재 입력 중인 화면을 덮어쓰지 않도록
      수정 중인 행은 잠시 건너뜀.
    */

    if(
      payload.eventType === "UPDATE" ||
      payload.eventType === "INSERT"
    ){

      const id =
        payload.new?.id;


      const index =
        members.findIndex(
          member =>
            member.id === id
        );


      if(
        index !== -1 &&
        isEditing(index)
      ){

        return;

      }

    }


    loadMembers();

  }
)
.subscribe();


/* =========================================
   수정 중인지 확인
========================================= */

function isEditing(index){

  const button =
    document.getElementById(
      "save-"+index
    );


  return button &&
    button.style.display !== "none";

}


/* =========================================
   RENDER
========================================= */

function render(){

  const tbody =
    document.getElementById(
      "members"
    );

  tbody.innerHTML = "";


  const search =
    document.getElementById(
      "search"
    )
    .value
    .trim()
    .toLowerCase();


  const sort =
    document.getElementById(
      "sort"
    ).value;


  let list =
    [...members];


  if(search){

    list =
      list.filter(member =>
        member.name
          .toLowerCase()
          .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(b[sort]) -
        toNumber(a[sort])
    );

  }


  list.forEach(
    (member,index) => {

      const originalIndex =
        members.findIndex(
          x =>
            x.id === member.id
        );


      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>

          <button
            class="edit-btn"
            id="edit-${originalIndex}"
            onclick="editMember(${originalIndex})"
          >
            수정
          </button>

          <button
            class="save-btn"
            id="save-${originalIndex}"
            onclick="saveMember(${originalIndex})"
          >
            저장
          </button>

        </td>


        <td>

          <input
            type="checkbox"
            class="checkbox"
            id="ascension-${originalIndex}"
            ${member.ascension ? "checked" : ""}
            onchange="toggleAscension(${originalIndex})"
          >

        </td>


        <td class="name-cell">

          ${
            sort !== "default"
            ?
            `<span class="rank">
              ${index+1}위
            </span> `
            :
            ""
          }

          <input
            class="name-input"
            id="name-${originalIndex}"
            value="${escapeHtml(member.name)}"
            disabled
          >

        </td>


        <td>

          <input
            class="resource-input"
            id="chomul-${originalIndex}"
            value="${escapeHtml(member.chomul)}"
            disabled
          >

        </td>


        <td>

          <div class="resource-box">

            <span class="lv-label">
              LV
            </span>

            <input
              class="lv-input"
              id="skill_lv-${originalIndex}"
              type="number"
              min="0"
              step="1"
              value="${member.skill_lv}"
              disabled
            >

            <input
              class="resource-input"
              id="skill-${originalIndex}"
              value="${escapeHtml(member.skill)}"
              disabled
              oninput="checkColor(this,'skill')"
            >

          </div>

        </td>


        <td>

          <div class="resource-box">

            <span class="lv-label">
              LV
            </span>

            <input
              class="lv-input"
              id="eggshell_lv-${originalIndex}"
              type="number"
              min="0"
              step="1"
              value="${member.eggshell_lv}"
              disabled
            >

            <input
              class="resource-input"
              id="eggshell-${originalIndex}"
              value="${escapeHtml(member.eggshell)}"
              disabled
              oninput="checkColor(this,'eggshell')"
            >

          </div>

        </td>


        <td>

          <input
            class="resource-input"
            type="number"
            min="0"
            step="1"
            id="eggmerge-${originalIndex}"
            value="${member.eggmerge}"
            disabled
          >

        </td>


        <td>

          <div class="resource-box">

            <span class="lv-label">
              LV
            </span>

            <input
              class="lv-input"
              id="mount_lv-${originalIndex}"
              type="number"
              min="0"
              step="1"
              value="${member.mount_lv}"
              disabled
            >

            <input
              class="resource-input"
              id="mount-${originalIndex}"
              value="${escapeHtml(member.mount)}"
              disabled
              oninput="checkColor(this,'mount')"
            >

          </div>

        </td>


        <td>

          <input
            class="resource-input"
            type="number"
            min="0"
            step="1"
            id="mountmerge-${originalIndex}"
            value="${member.mountmerge}"
            disabled
          >

        </td>


        <td>

          ${formatUpdated(
            member.updated_at
          )}

        </td>

      `;


      tbody.appendChild(tr);


      checkColor(
        document.getElementById(
          "skill-"+originalIndex
        ),
        "skill"
      );


      checkColor(
        document.getElementById(
          "eggshell-"+originalIndex
        ),
        "eggshell"
      );


      checkColor(
        document.getElementById(
          "mount-"+originalIndex
        ),
        "mount"
      );


      /*
        수정 중인 상태라면
        임시저장된 값은 그대로 입력 가능
      */

      if(
        isEditing(originalIndex)
      ){

        enableFields(
          originalIndex
        );

      }

    }
  );


  updateTotals();

}


/* =========================================
   입력값 변경 감지
========================================= */

function enableDraftAutoSave(index){

  const fields = [

    "name",
    "chomul",
    "skill_lv",
    "skill",
    "eggshell_lv",
    "eggshell",
    "eggmerge",
    "mount_lv",
    "mount",
    "mountmerge"

  ];


  fields.forEach(
    field => {

      const element =
        document.getElementById(
          field+"-"+index
        );


      if(!element)
        return;


      element.addEventListener(
        "input",
        () => {

          saveDraft(index);

          if(
            field === "skill" ||
            field === "eggshell" ||
            field === "mount"
          ){

            const type =
              field === "skill"
              ? "skill"
              : field === "eggshell"
              ? "eggshell"
              : "mount";


            checkColor(
              element,
              type
            );

          }

        }
      );

    }
  );

}

/* =========================================
   SAVE
========================================= */

async function saveMember(index){

  const member =
    members[index];


  const value =
    field => {

      const element =
        document.getElementById(
          field+"-"+index
        );

      return element
        ? element.value.trim()
        : "";

    };


  const nickname =
    value("name");


  const chomul =
    value("chomul");


  const skill =
    value("skill");


  const skill_lv =
    Number(
      value("skill_lv")
    ) || 0;


  const eggshell =
    value("eggshell");


  const eggshell_lv =
    Number(
      value("eggshell_lv")
    ) || 0;


  const eggmerge =
    Number(
      value("eggmerge")
    ) || 0;


  const mount =
    value("mount");


  const mount_lv =
    Number(
      value("mount_lv")
    ) || 0;


  const mountmerge =
    Number(
      value("mountmerge")
    ) || 0;


  setStatus(
    "💾 저장 중..."
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .update({

      nickname:
        nickname,

      초물:
        chomul,

      스킬:
        skill,

      스킬_lv:
        skill_lv,

      알껍질:
        eggshell,

      알껍질_lv:
        eggshell_lv,

      알합치기:
        eggmerge,

      탈것:
        mount,

      탈것_lv:
        mount_lv,

      탈것합치기:
        mountmerge,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      member.id
    )
    .select()
    .single();


  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n"+
      error.message
    );

    setStatus(
      "❌ 저장 실패",
      "error"
    );

    return;

  }


  /*
    정식 저장 성공
    → 휴대폰 임시저장 삭제
  */

  removeDraft(
    member.id
  );


  members[index] = {

    id:
      data.id,

    created_at:
      data.created_at,

    updated_at:
      data.updated_at,

    name:
      data.nickname || "",

    ascension:
      data.승천대기자 || false,

    chomul:
      data.초물 || "",

    skill:
      data.스킬 || "",

    skill_lv:
      data.스킬_lv ?? 0,

    eggshell:
      data.알껍질 || "",

    eggshell_lv:
      data.알껍질_lv ?? 0,

    eggmerge:
      data.알합치기 ?? 0,

    mount:
      data.탈것 || "",

    mount_lv:
      data.탈것_lv ?? 0,

    mountmerge:
      data.탈것합치기 ?? 0

  };


  render();


  setStatus(
    "✅ 저장 완료 · 실시간 반영됨",
    "success"
  );

}


/* =========================================
   ASCENSION
========================================= */

async function toggleAscension(index){

  const member =
    members[index];


  const checkbox =
    document.getElementById(
      "ascension-"+index
    );


  const checked =
    checkbox.checked;


  /*
    승천대기도 즉시 임시저장
  */

  saveDraft(index);


  const {
    error
  } =
  await supabaseClient
    .from("clan_members")
    .update({

      승천대기자:
        checked,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      member.id
    );


  if(error){

    console.error(error);

    checkbox.checked =
      !checked;

    return;

  }


  members[index].ascension =
    checked;


  members[index].updated_at =
    new Date().toISOString();


  /*
    체크 저장 성공했으므로
    체크 관련 임시값은 다시 저장
    다른 입력 중인 값은 유지
  */

  saveDraft(index);


  setStatus(
    checked
    ?
    "✅ 승천대기자로 표시했습니다."
    :
    "승천대기자 표시를 해제했습니다.",
    "success"
  );

}


/* =========================================
   RED COLOR
========================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}


/* =========================================
   NUMBER
========================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(/,/g,"");


  let number =
    parseFloat(text);


  if(isNaN(number))
    return 0;


  if(
    text.endsWith("m")
  ){

    number *= 1000000;

  }
  else if(
    text.endsWith("k")
  ){

    number *= 1000;

  }


  return number;

}


/* =========================================
   NUMBER DISPLAY
========================================= */

function formatNumber(number){

  if(number === 0)
    return "0";


  if(number >= 1000000){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    ) + "m";

  }


  if(number >= 1000){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    ) + "k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================
   LAST UPDATED
========================================= */

function formatUpdated(value){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff / 60000
    );


  if(minutes < 1){

    return `
      <span class="recent">
        방금 수정
      </span>
    `;

  }


  if(minutes < 60){

    return minutes +
      "분 전";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours +
      "시간 전";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days +
      "일 전";

  }


  return (
    date.getMonth()+1
  ) +
  "월 " +
  date.getDate() +
  "일";

}


/* =========================================
   TOTAL
========================================= */

function updateTotals(){

  const fields = [

    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge"

  ];


  const totals = {};


  fields.forEach(
    field => {

      totals[field] = 0;

    }
  );


  members.forEach(
    member => {

      fields.forEach(
        field => {

          totals[field] +=
            toNumber(
              member[field]
            );

        }
      );

    }
  );


  document.getElementById(
    "total-chomul"
  ).textContent =
    formatNumber(
      totals.chomul
    );


  document.getElementById(
    "total-skill"
  ).textContent =
    formatNumber(
      totals.skill
    );


  document.getElementById(
    "total-eggshell"
  ).textContent =
    formatNumber(
      totals.eggshell
    );


  document.getElementById(
    "total-eggmerge"
  ).textContent =
    Math.round(
      totals.eggmerge
    ) + "개";


  document.getElementById(
    "total-mount"
  ).textContent =
    formatNumber(
      totals.mount
    );


  document.getElementById(
    "total-mountmerge"
  ).textContent =
    Math.round(
      totals.mountmerge
    ) + "개";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}
