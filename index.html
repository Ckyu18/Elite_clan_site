<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forge Master Clan Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #9aa8bd;
    margin-bottom: 30px;
}

.card {
    background: #111a2b;
    border: 1px solid #263550;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #b8c5d8;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #34445e;
    background: #080d18;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #3478f6;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    background: #245bc0;
}

.result {
    display: none;
}

.info {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #263550;
}

.info:last-child {
    border-bottom: 0;
}

.value {
    color: #6fa8ff;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #66758c;
    margin-top: 30px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>⚔️ Forge Master</h1>

    <div class="subtitle">
        Clan Viewer
    </div>

    <div class="card">

        <label>플레이어 닉네임</label>

        <input
            id="nickname"
            type="text"
            placeholder="닉네임을 입력하세요"
        >

        <button onclick="searchPlayer()">
            🔎 조회하기
        </button>

    </div>

    <div id="result" class="card result">

        <h2>👤 플레이어 정보</h2>

        <div class="info">
            <span>닉네임</span>
            <span class="value" id="playerName">-</span>
        </div>

        <div class="info">
            <span>레벨</span>
            <span class="value">125</span>
        </div>

        <div class="info">
            <span>점수</span>
            <span class="value">125,000</span>
        </div>

        <div class="info">
            <span>클랜</span>
            <span class="value">Elite Clan</span>
        </div>

        <div class="info">
            <span>상태</span>
            <span class="value">온라인</span>
        </div>

    </div>

    <div class="card">

        <h2>🏆 클랜 정보</h2>

        <div class="info">
            <span>클랜명</span>
            <span class="value">Elite Clan</span>
        </div>

        <div class="info">
            <span>클랜 레벨</span>
            <span class="value">10</span>
        </div>

        <div class="info">
            <span>클랜원</span>
            <span class="value">25명</span>
        </div>

    </div>

    <div class="footer">
        Forge Master Clan Viewer
    </div>

</div>

<script>

function searchPlayer() {

    const nickname =
        document.getElementById("nickname").value.trim();

    if (nickname === "") {
        alert("닉네임을 입력해주세요.");
        return;
    }

    document.getElementById("playerName").textContent =
        nickname;

    document.getElementById("result").style.display =
        "block";
}

</script>

</body>
</html>
