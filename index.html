/* =========================================

/* =========================================
   STATUS

function setStatus(

  type=""
){

    document.getElementById(

    );

  element.textContent =

  element.className =

/* =========================================
   LOAD MEMBERS
========================================= */

async function loadMembers(){

  const oldStatus =
    document.getElementById(
      "status"
    ).textContent;


  if(
    oldStatus !==
    "🟢 실시간 연결됨"
  ){

    setStatus(
      "데이터를 불러오는 중..."
    );

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("clan_members")
    .select(
      "id,created_at,updated_at,nickname,초물,스킬,알껍질,알합치기,탈것,탈것합치기,골드,망치"
    )
    .order(
      "id",
      {
        ascending:true
      }
    );


  if(error){

    console.error(error);

    setStatus(
      "❌ 데이터를 불러오지 못했습니다.",
      "error"
    );

    return;

  }


  members =
    (data || []).map(
      row => ({

        id:
          row.id,

        created_at:
          row.created_at,

        updated_at:
          row.updated_at,

        name:
          row.nickname || "",

        chomul:
          row.초물 || "",

        skill:
          row.스킬 || "",

        eggshell:
          row.알껍질 || "",

        eggmerge:
          row.알합치기 ?? 0,

        mount:
          row.탈것 || "",

        mountmerge:
          row.탈것합치기 ?? 0,

        gold:
          row.골드 || "",

        hammer:
          row.망치 || ""

      })
    );


  render();

}


/* =========================================
   REALTIME
========================================= */

    },
    payload => {

/* =========================================
   RENDER
========================================= */

function render(){

  const tbody =
    document.getElementById(
      "members"
    );


  tbody.innerHTML = "";


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const sort =
    document
      .getElementById(
        "sort"
      )
      .value;


  let list =
    [...members];


  /* 검색 */

  if(search){

    list =
      list.filter(
        member =>
          member.name
            .toLowerCase()
            .includes(search)
      );

  }


  /* 정렬 */

  if(
    sort !==
    "default"
  ){

    list.sort(
      (a,b) => {

        return (
          toNumber(
            b[sort]
          ) -
          toNumber(
            a[sort]
          )
        );

      }
    );

  }


  /* 화면 출력 */

  list.forEach(
    (member,index) => {

        members.findIndex(
          x =>

            member.id
        );

        document.createElement(
          "tr"

            disabled>

        <td>

        </td>


        <td>

          <input
            id="eggshell-${originalIndex}"

            disabled
            oninput="
              checkColor(
                this,
                'eggshell'
              )
            ">

        </td>


        <td>

          <input
            id="eggmerge-${originalIndex}"
            type="number"
            value="${member.eggmerge}"
            disabled>

        </td>


        <td>

          <input
            id="mount-${originalIndex}"

            oninput="

                this,

              )

        </td>


        <td>

          <input
            id="mountmerge-${originalIndex}"
            type="number"
            value="${member.mountmerge}"
            disabled>

        </td>


        <td>

          <input
            id="gold-${originalIndex}"
            value="${escapeHtml(member.gold)}"
            disabled>

        </td>


        <td>

          <input
            id="hammer-${originalIndex}"
            value="${escapeHtml(member.hammer)}"
            disabled>

        </td>


        <td>

          ${formatUpdated(
            member.updated_at

        <td>

          <button
            class="edit-btn"

            onclick="
              editMember(

              )

            수정

          </button>


          <button
            class="save-btn"
            id="save-${originalIndex}"
            onclick="
              saveMember(
                ${originalIndex}
              )

            저장

          </button>

      `;


      tbody.appendChild(

      );


      checkColor(
        document.getElementById(
          "skill-"+originalIndex

      );


      checkColor(
        document.getElementById(
          "eggshell-"+originalIndex
        ),
        "eggshell"

}

/* =========================================
   RED COLOR
========================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}


/* =========================================
   NUMBER PARSER
========================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(text);


  if(
    isNaN(number)
  ){

    return 0;

  }


  if(
    text.endsWith("m")
  ){

    number *=
      1000000;

  }

  else if(
    text.endsWith("k")
  ){

    number *=
      1000;

  }


  return number;

}


/* =========================================
   NUMBER FORMAT
========================================= */

function formatNumber(
  number
){

  if(
    number === 0
  ){

    return "0";

  }


  if(
    number >= 1000000
  ){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    )+"m";

  }


  if(
    number >= 1000
  ){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    )+"k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================
   LAST UPDATED
========================================= */

function formatUpdated(
  value
){

  if(!value){

    return "-";

  }


  const date =
    new Date(
      value
    );


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff /
      60000
    );


  if(
    minutes < 1
  ){

    return `
      <span class="recent">
        방금 수정
      </span>
    `;

  }


  if(
    minutes < 60
  ){

    return `
      ${minutes}분 전
    `;

  }


  const hours =
    Math.floor(
      minutes /
      60
    );


  if(
    hours < 24
  ){

    return `
      ${hours}시간 전
    `;

  }


  const days =
    Math.floor(
      hours /
      24
    );


  if(
    days < 7
  ){

    return `
      ${days}일 전
    `;

  }


  return (
    date.getMonth()+1
  )
  +"월 "+
  date.getDate()
  +"일";

}


/* =========================================

========================================= */

function updateTotals(){

  const fields = [

    "chomul",
    "skill",
    "eggshell",
    "eggmerge",
    "mount",
    "mountmerge",
    "gold",
    "hammer"

  ];


  const totals = {};


  fields.forEach(
    field => {

      totals[field] =
        0;

    }
  );


  members.forEach(
    member => {

      fields.forEach(
        field => {

          totals[field] +=
            toNumber(
              member[field]
            );

        }
      );

    }
  );


  document.getElementById(
    "total-chomul"
  ).textContent =
    formatNumber(
      totals.chomul
    );


  document.getElementById(
    "total-skill"
  ).textContent =
    formatNumber(
      totals.skill
    );


  document.getElementById(
    "total-eggshell"
  ).textContent =
    formatNumber(
      totals.eggshell
    );


  document.getElementById(
    "total-eggmerge"
  ).textContent =
    Math.round(
      totals.eggmerge
    )+"개";


  document.getElementById(
    "total-mount"
  ).textContent =
    formatNumber(
      totals.mount
    );


  document.getElementById(
    "total-mountmerge"
  ).textContent =
    Math.round(
      totals.mountmerge

  document.getElementById(
    "total-gold"
  ).textContent =

  document.getElementById(

  ).textContent =

    );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}
