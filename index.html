/* =========================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}

/* =========================================
   숫자 변환
========================================= */

function toNumber(value){

  if(!value)
    return 0;


  value =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(value);


  if(isNaN(number))
    return 0;


  if(
    value.endsWith("m")
  ){

    number *= 1000000;

  }

  else if(
    value.endsWith("k")
  ){

    number *= 1000;

  }


  return number;

}


/* =========================================
   숫자 표시
========================================= */

function formatNumber(number){

  if(
    number===0
  )
    return "0";


  if(
    number>=1000000
  ){

    return Number(
      (
        number/
        1000000
      ).toFixed(2)
    )+"m";

  }


  if(
    number>=1000
  ){

    return Number(
      (
        number/
        1000
      ).toFixed(2)
    )+"k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================
   빨간색
========================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type==="skill" &&
    value>=50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type==="eggshell" &&
    value>=50000

    input.classList.add(
      "red"
    );

  }


  if(
    type==="mount" &&
    value>=30000
  ){

    input.classList.add(
      "red"
    );

  }

}

      totals.mountmerge
    )+"개";


  document.getElementById(
    "total-gold"
  ).textContent=
    formatNumber(
      totals.gold
    );


  document.getElementById(
    "total-hammer"
  ).textContent=
    formatNumber(
      totals.hammer
    );

}


/* =========================================
   시작
========================================= */

loadMembers();

</script>
