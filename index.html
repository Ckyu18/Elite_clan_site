<html lang="ko">

<head>

<meta charset="UTF-8">

>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#080d18;
  color:#f8fafc;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =========================================================
   LOGIN
========================================================= */

#login-screen{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.login-box{

  width:100%;

  max-width:380px;

  background:#111a2b;

  border:1px solid #263550;

  border-radius:16px;

  padding:25px;

  text-align:center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}

.login-logo{

  font-size:45px;

}

.login-box h2{

  margin:8px 0 4px;

}

.login-box p{

  color:#94a3b8;

  font-size:12px;

  margin:0 0 20px;

}

.login-box input{

  width:100%;

  margin-bottom:10px;

  padding:13px;

  font-size:14px;

  border:1px solid #334155;

  border-radius:8px;

  background:#080d18;

  color:white;

}

.login-box input:focus{

  outline:none;

  border-color:#3b82f6;

  box-shadow:
    0 0 0 2px
    rgba(59,130,246,.15);

}

.login-box button{

  width:100%;

  padding:13px;

  border:0;

  border-radius:8px;

  background:#2563eb;

  color:white;

  font-weight:900;

  cursor:pointer;

}

.login-box button:disabled{

  opacity:.6;

}

.login-admin-hint{

  margin-top:12px;

  color:#64748b;

  font-size:10px;

}

#login-status{

  min-height:20px;

  margin-top:12px;

  font-size:12px;

  color:#f87171;

}


/* =========================================================
   APP
========================================================= */

#app{

  display:none;

}

.container{

  max-width:1500px;

  margin:auto;

  padding:10px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  position:relative;

  text-align:center;

  padding:10px 0 14px;

}

.logo{

  font-size:34px;

}

h1{

  margin:2px 0;

  font-size:23px;

}

.subtitle{

  margin:3px 0;

  color:#94a3b8;

  font-size:12px;

}

.header-buttons{

  position:absolute;

  right:0;

  top:10px;

  display:flex;

  gap:6px;

  align-items:center;

}

.mode-badge{

  border-radius:7px;

  padding:7px 10px;

  font-size:11px;

  font-weight:900;

}

.member-mode{

  border:1px solid #334155;

  background:#111a2b;

  color:#94a3b8;

}

.admin-mode{

  border:1px solid #7c3aed;

  background:#24113f;

  color:#d8b4fe;

}

.logout-btn{

  border:1px solid #334155;

  background:#111a2b;

  color:#cbd5e1;

  border-radius:7px;

  padding:7px 10px;

  font-size:11px;

  cursor:pointer;

  font-weight:800;

}


/* =========================================================
   NOTICE
========================================================= */

.notice{

  background:#111a2b;

  border:1px solid #263550;

  border-radius:12px;

  padding:10px;

  margin-bottom:10px;

  color:#cbd5e1;

  font-size:11px;

  line-height:1.6;

}

.notice b{

  color:#60a5fa;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  display:flex;

  gap:7px;

  margin-bottom:8px;

}

.search{

  flex:1;

  min-width:0;

  padding:10px;

  border-radius:8px;

  border:1px solid #334155;

  background:#111a2b;

  color:white;

  font-size:13px;

}

.sort{

  padding:10px;

  border-radius:8px;

  border:1px solid #334155;

  background:#111a2b;

  color:white;

  font-size:12px;

}


/* =========================================================
   STATUS
========================================================= */

.status{

  text-align:center;

  min-height:18px;

  margin:6px 0;

  color:#94a3b8;

  font-size:11px;

}

.success{

  color:#4ade80;

}

.error{

  color:#f87171;

}


/* =========================================================
   TABLE
========================================================= */

.table-wrap{

  overflow-x:auto;

  background:#111a2b;

  border:1px solid #263550;

  border-radius:12px;

  -webkit-overflow-scrolling:touch;

}

table{

  border-collapse:collapse;

  width:100%;

  min-width:1300px;

}

th{

  background:#18243a;

  color:#c8d8ef;

  padding:9px 5px;

  font-size:11px;

  white-space:nowrap;

  position:sticky;

  top:0;

  z-index:3;

}

td{

  padding:6px 4px;

  border-top:1px solid #263550;

  text-align:center;

  white-space:nowrap;

  font-size:11px;

}

.name-cell{

  text-align:left;

}


/* =========================================================
   ASCENSION
========================================================= */

.ascension-cell{

  min-width:90px;

}

.ascension-title{

  color:#fbbf24;

  font-size:11px;

  font-weight:900;

  margin-bottom:5px;

}

.check-group{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  justify-content:center;

  gap:4px;

  padding:1px 5px;

}

.check-item{

  display:flex;

  align-items:center;

  gap:5px;

  cursor:pointer;

  color:#e2e8f0;

  font-size:11px;

  font-weight:700;

}

.checkbox{

  width:18px;

  height:18px;

  margin:0;

  accent-color:#22c55e;

  cursor:pointer;

}


/* =========================================================
   INPUT
========================================================= */

input{

  width:65px;

  padding:7px 4px;

  border:1px solid #334155;

  border-radius:6px;

  background:#080d18;

  color:white;

  text-align:center;

  font-size:11px;

}

.name-input{

  width:110px;

  text-align:left;

}

input:focus{

  outline:none;

  border-color:#3b82f6;

  box-shadow:
    0 0 0 2px
    rgba(59,130,246,.15);

}

input:disabled{

  opacity:.75;

}


/* =========================================================
   RESOURCE
========================================================= */

.resource-box{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:3px;

}

.lv-label{

  color:#94a3b8;

  font-size:10px;

  font-weight:800;

}

.lv-input{

  width:40px;

  min-width:40px;

  padding:7px 2px;

}

.resource-input{

  width:65px;

  min-width:65px;

}


/* =========================================================
   RED
========================================================= */

.red{

  color:#ff4d4d !important;

  font-weight:900;

  background:#180d13 !important;

  border-color:#7f1d1d !important;

}


/* =========================================================
   BUTTON
========================================================= */

.edit-btn,
.save-btn{

  border:0;

  border-radius:7px;

  padding:8px 9px;

  color:white;

  font-size:11px;

  font-weight:800;

  min-width:48px;

  cursor:pointer;

  touch-action:manipulation;

}

.edit-btn{

  background:#2563eb;

}

.save-btn{

  display:none;

  background:#16a34a;

}


/* =========================================================
   TOTAL
========================================================= */

.total{

  background:#1d293d;

  font-weight:bold;

}

.total td{

  border-top:2px solid #3b4d6b;

  font-size:11px;

}


/* =========================================================
   ADMIN
========================================================= */

.admin-only{

  display:none;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .container{

    padding:7px;

  }

  .logo{

    font-size:30px;

  }

  h1{

    font-size:20px;

  }

  .header-buttons{

    position:static;

    justify-content:center;

    margin-top:8px;

  }

  .toolbar{

    flex-direction:column;

  }

  .search,
  .sort{

    width:100%;

  }

  th{

    padding:9px 5px;

  }

  td{

    padding:5px 4px;

  }

  input{

    padding:8px 3px;

  }

  .resource-box{

    gap:2px;

  }

  .lv-input{

    width:38px;

    min-width:38px;

  }

  .resource-input{

    width:62px;

    min-width:62px;

  }

  .edit-btn,
  .save-btn{

    padding:9px;

  }

}

</style>

</head>

<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div id="login-screen">

  <div class="login-box">

    <div class="login-logo">

    </div>

    <h2>

    </h2>

    <input

        id="members"
      ></tbody>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://tsiqozaeoainplwbjocb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_lBWmc1ci2pdmPW_Xr93b5Q_l8U6UM4t";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SESSION
========================================================= */

const SESSION_KEY =
  "forge_master_session_v1";


let sessionToken =
  localStorage.getItem(
    SESSION_KEY
  );


let currentRole =
  "회원";


let currentUserNickname =
  "";


let currentMemberId =
  null;


let members =
  [];


/* =========================================================
   LOGIN SCREEN
========================================================= */

function showLogin(){

  document.getElementById(
    "login-screen"
  ).style.display =
    "flex";


  document.getElementById(
    "app"
  ).style.display =
    "none";

}


function showApp(){

  document.getElementById(
    "login-screen"
  ).style.display =
    "none";


  document.getElementById(
    "app"
  ).style.display =
    "block";

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const nickname =
    document.getElementById(
      "login-nickname"
    ).value.trim();


  const password =
    document.getElementById(
      "login-password"
    ).value;


  const status =
    document.getElementById(
      "login-status"
    );


  const button =
    document.getElementById(
      "login-button"
    );


  if(!password){

    status.textContent =
      "비밀번호를 입력해주세요.";

    return;

  }


  button.disabled =
    true;


  status.textContent =
    "접속 중...";


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_start_session",
      {
        p_password:
          password,

        p_nickname:
          nickname || null
      }
    );


  button.disabled =
    false;


  if(error){

    console.error(error);

    status.textContent =
      error.message ||
      "접속에 실패했습니다.";

    return;

  }


  if(!data){

    status.textContent =
      "접속 정보를 받지 못했습니다.";

    return;

  }


  sessionToken =
    data.token;


  currentRole =
    data.role ||
    "회원";


  currentUserNickname =
    data.nickname ||
    "";


  currentMemberId =
    data.member_id ||
    null;


  localStorage.setItem(
    SESSION_KEY,
    sessionToken
  );


  document.getElementById(
    "login-password"
  ).value =
    "";


  status.textContent =
    "";


  setupModeUI();

  showApp();

  await loadMembers();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  if(sessionToken){

    await supabaseClient
      .rpc(
        "fm_logout",
        {
          p_token:
            sessionToken
        }
      );

  }


  localStorage.removeItem(
    SESSION_KEY
  );


  sessionToken =
    null;


  currentRole =
    "회원";


  currentUserNickname =
    "";


  currentMemberId =
    null;


  members =
    [];


  document.getElementById(
    "login-nickname"
  ).value =
    "";


  document.getElementById(
    "login-password"
  ).value =
    "";


  showLogin();

}


/* =========================================================
   MODE UI
========================================================= */

function setupModeUI(){

  const badge =
    document.getElementById(
      "mode-badge"
    );


  const notice =
    document.getElementById(
      "mode-notice"
    );


  if(
    currentRole === "관리자"
  ){

    badge.textContent =
      "👑 관리자 모드";


    badge.className =
      "mode-badge admin-mode";


    notice.textContent =
      "관리자 모드 · 전체 인원의 데이터를 확인하고 수정할 수 있습니다.";

  }
  else{

    badge.textContent =
      currentUserNickname +
      " · 회원";


    badge.className =
      "mode-badge member-mode";


    notice.textContent =
      "현재 본인 데이터만 표시됩니다.";

  }

}


/* =========================================================
   LOAD
========================================================= */

async function loadMembers(){

  if(!sessionToken){

    showLogin();

    return;

  }


  setStatus(
    "데이터를 불러오는 중..."
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_get_members",
      {
        p_token:
          sessionToken
      }
    );


  if(error){

    console.error(error);

    if(
      String(
        error.message
      ).includes(
        "세션"
      )
    ){

      alert(
        "세션이 만료되었습니다.\n다시 접속해주세요."
      );

      logout();

      return;

    }


    setStatus(
      "❌ 데이터를 불러오지 못했습니다.\n" +
      error.message,
      "error"
    );

    return;

  }


  try{

    members =
      Array.isArray(data)
        ? data
        : [];

  }
  catch(e){

    members =
      [];

  }


  render();


  setStatus(
    currentRole === "관리자"
      ? "👑 관리자 모드 · 전체 데이터"
      : "✅ 본인 데이터",
    "success"
  );

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  async () => {

    if(
      sessionToken &&
      document.visibilityState ===
        "visible"
    ){

      await loadMembers();

    }

  },
  15000
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type=""
){

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;


  element.className =
    "status " +
    type;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const tbody =
    document.getElementById(
      "members"
    );


  if(!tbody)
    return;


  tbody.innerHTML =
    "";


  const search =
    (
      document.getElementById(
        "search"
      )?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const sort =
    document.getElementById(
      "sort"
    )?.value ||
    "default";


  let list =
    [...members];


  if(search){

    list =
      list.filter(
        member =>
          String(
            member.nickname ||
            ""
          )
          .toLowerCase()
          .includes(search)
      );

  }


  if(sort !== "default"){

    list.sort(
      (a,b) =>
        toNumber(
          b[sort]
        ) -
        toNumber(
          a[sort]
        )
    );

  }


  list.forEach(
    (member,index) => {

      const tr =
        document.createElement(
          "tr"
        );


      const canEdit =
        currentRole === "관리자" ||
        Number(member.id) ===
          Number(currentMemberId);


      tr.innerHTML = `

<td>

<button
  class="edit-btn"
  id="edit-${member.id}"
  onclick="editMember(${member.id})"
  ${canEdit ? "" : "style='display:none'"}
>
수정
</button>

<button
  class="save-btn"
  id="save-${member.id}"
  onclick="saveMember(${member.id})"
>
저장
</button>

</td>


<td class="ascension-cell">

<div class="ascension-title">
승천대기
</div>

<div class="check-group">

<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_s-${member.id}"
  ${member["스"] ? "checked" : ""}
  ${canEdit ? "" : "disabled"}
  onchange="markDirty(${member.id})"
>

<span>스</span>

</label>


<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_pet-${member.id}"
  ${member["펫"] ? "checked" : ""}
  ${canEdit ? "" : "disabled"}
  onchange="markDirty(${member.id})"
>

<span>펫</span>

</label>


<label class="check-item">

<input
  type="checkbox"
  class="checkbox"
  id="check_tal-${member.id}"
  ${member["탈"] ? "checked" : ""}
  ${canEdit ? "" : "disabled"}

/* =========================================================
   EDIT
========================================================= */

function editMember(id){

  const member =
    members.find(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(!member)
    return;


  const canEdit =
    currentRole === "관리자" ||
    Number(id) ===
      Number(currentMemberId);


  if(!canEdit){

    alert(
      "본인의 데이터만 수정할 수 있습니다."
    );

    return;

  }


  const fields = [

    "name",

    "chomul",

    "skill_lv",

    "skill",

    "eggshell_lv",

    "eggshell",

    "eggmerge",

    "mount_lv",

    "mount",

    "mountmerge"

  ];


  fields.forEach(
    field => {

      const input =
        document.getElementById(
          field +
          "-" +
          id
        );


      if(input){

        input.disabled =
          false;

      }

    }
  );


  document.getElementById(
    "check_s-" +
    id
  ).disabled =
    false;


  document.getElementById(
    "check_pet-" +
    id
  ).disabled =
    false;


  document.getElementById(
    "check_tal-" +
    id
  ).disabled =
    false;


  const edit =
    document.getElementById(
      "edit-" +
      id
    );


  const save =
    document.getElementById(
      "save-" +
      id
    );


  if(edit){

    edit.style.display =
      "none";

  }


  if(save){

    save.style.display =
      "inline-block";

  }


  setStatus(
    currentRole === "관리자"
      ? "👑 관리자 수정 중"
      : "✏️ 본인 데이터 수정 중"
  );

}


/* =========================================================
   DIRTY
========================================================= */

function markDirty(id){

  const save =
    document.getElementById(
      "save-" +
      id
    );


  const edit =
    document.getElementById(
      "edit-" +
      id
    );


  if(save){

    save.style.display =
      "inline-block";

  }


  if(edit){

    edit.style.display =
      "none";

  }

}


/* =========================================================
   SAVE
========================================================= */

async function saveMember(id){

  const member =
    members.find(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(!member)
    return;


  const canEdit =
    currentRole === "관리자" ||
    Number(id) ===
      Number(currentMemberId);


  if(!canEdit){

    alert(
      "수정 권한이 없습니다."
    );

    return;

  }


  const getValue =
    field => {

      const element =
        document.getElementById(
          field +
          "-" +
          id
        );


      return element
        ? element.value.trim()
        : "";

    };


  const getChecked =
    field => {

      const element =
        document.getElementById(
          field +
          "-" +
          id
        );


      return element
        ? element.checked
        : false;

    };


  setStatus(
    "💾 저장 중..."
  );


  const payload = {

    nickname:
      getValue("name"),

    초물:
      getValue("chomul"),

    스킬:
      getValue("skill"),

    스킬_lv:
      Number(
        getValue("skill_lv")
      ) || 0,

    알껍질:
      getValue("eggshell"),

    알껍질_lv:
      Number(
        getValue("eggshell_lv")
      ) || 0,

    알합치기:
      Number(
        getValue("eggmerge")
      ) || 0,

    탈것:
      getValue("mount"),

    탈것_lv:
      Number(
        getValue("mount_lv")
      ) || 0,

    탈것합치기:
      Number(
        getValue("mountmerge")
      ) || 0,

    스:
      getChecked("check_s"),

    펫:
      getChecked("check_pet"),

    탈:
      getChecked("check_tal")

  };


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_update_member",
      {

        p_token:
          sessionToken,

        p_member_id:
          Number(id),

        p_data:
          payload

      }
    );


  if(error){

    console.error(error);

    alert(
      "저장 실패\n\n" +
      error.message
    );


    setStatus(
      "❌ 저장 실패",
      "error"
    );


    return;

  }


  const index =
    members.findIndex(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(index !== -1){

    members[index] =
      data;

  }


  if(
    Number(id) ===
    Number(currentMemberId)
  ){

    currentUserNickname =
      data.nickname || "";

    setupModeUI();

  }


  render();


  setStatus(
    "✅ 저장 완료",
    "success"
  );

}


/* =========================================================
   COLOR
========================================================= */

function checkColor(
  input,
  type
){

  if(!input)
    return;


  const value =
    toNumber(
      input.value
    );


  input.classList.remove(
    "red"
  );


  if(
    type === "skill" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "eggshell" &&
    value >= 50000
  ){

    input.classList.add(
      "red"
    );

  }


  if(
    type === "mount" &&
    value >= 30000
  ){

    input.classList.add(
      "red"
    );

  }

}


/* =========================================================
   NUMBER
========================================================= */

function toNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  const text =
    String(value)
      .trim()
      .toLowerCase()
      .replace(
        /,/g,
        ""
      );


  let number =
    parseFloat(
      text
    );


  if(
    isNaN(number)
  )
    return 0;


  if(
    text.endsWith("m")
  ){

    number *=
      1000000;

  }
  else if(
    text.endsWith("k")
  ){

    number *=
      1000;

  }


  return number;

}


/* =========================================================
   NUMBER DISPLAY
========================================================= */

function formatNumber(
  number
){

  if(
    number === 0
  )
    return "0";


  if(
    number >= 1000000
  ){

    return Number(
      (
        number /
        1000000
      ).toFixed(2)
    ) + "m";

  }


  if(
    number >= 1000
  ){

    return Number(
      (
        number /
        1000
      ).toFixed(2)
    ) + "k";

  }


  return Math.round(
    number
  ).toString();

}


/* =========================================================
   UPDATED
========================================================= */

function formatUpdated(
  value
){

  if(!value)
    return "-";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  const diff =
    Date.now() -
    date.getTime();


  const minutes =
    Math.floor(
      diff / 60000
    );


  if(
    minutes < 1
  ){

    return "방금 수정";

  }


  if(
    minutes < 60
  ){

    return (
      minutes +
      "분 전"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(
    hours < 24
  ){

    return (
      hours +
      "시간 전"
    );

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(
    days < 7
  ){

    return (
      days +
      "일 전"
    );

  }


  return (
    date.getMonth() +
    1
  ) +
  "월 " +
  date.getDate() +
  "일";

}


/* =========================================================
   TOTAL
========================================================= */

function updateTotals(){

  const fields = [

    "초물",

    "스킬",

    "알껍질",

    "알합치기",

    "탈것",

    "탈것합치기"

  ];


  const totals = {};


  fields.forEach(
    field => {

      totals[field] =
        0;

    }
  );


  members.forEach(
    member => {

      fields.forEach(
        field => {

          totals[field] +=
            toNumber(
              member[field]
            );

        }
      );

    }
  );


  document.getElementById(
    "total-chomul"
  ).textContent =
    formatNumber(
      totals["초물"]
    );


  document.getElementById(
    "total-skill"
  ).textContent =
    formatNumber(
      totals["스킬"]
    );


  document.getElementById(
    "total-eggshell"
  ).textContent =
    formatNumber(
      totals["알껍질"]
    );


  document.getElementById(
    "total-eggmerge"
  ).textContent =
    Math.round(
      totals["알합치기"]
    ) +
    "개";


  document.getElementById(
    "total-mount"
  ).textContent =
    formatNumber(
      totals["탈것"]
    );


  document.getElementById(
    "total-mountmerge"
  ).textContent =
    Math.round(
      totals["탈것합치기"]
    ) +
    "개";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================================================
   START
========================================================= */

async function start(){

  showLogin();


  if(!sessionToken){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "fm_get_members",
      {
        p_token:
          sessionToken
      }
    );


  if(error){

    localStorage.removeItem(
      SESSION_KEY
    );

    sessionToken =
      null;

    showLogin();

    return;

  }


  /*
    기존 세션의 role/member 정보는
    화면 표시를 위해 localStorage에 별도로 저장하지 않고
    데이터 형태로 판단한다.
  */

  const savedRole =
    localStorage.getItem(
      "forge_master_role"
    ) ||
    "회원";


  currentRole =
    savedRole;


  if(
    currentRole !== "관리자"
  ){

    currentRole =
      "회원";

  }


  if(
    Array.isArray(data)
  ){

    members =
      data;

  }


  if(
    currentRole === "회원" &&
    members.length
  ){

    currentMemberId =
      members[0].id;

    currentUserNickname =
      members[0].nickname ||
      "";

  }


  setupModeUI();

  showApp();

  render();

}
